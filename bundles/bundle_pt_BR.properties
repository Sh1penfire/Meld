block.meld-sunder.name = Sunder
block.meld-sunder.description = Dispara aglomerados de Detritos em alvos inimigos\n[accent]Alto dano contra alvos voadores[]

block.meld-shredstorm.name = Multiladora
block.meld-shredstorm.description = Tritura alvos inimigos com estilhaços que possuem leve penetração.\n[accent]Propagação de balas depende da direção de disparo\n\nEfeitos variam a depender da munição usada[]

block.meld-flurry.name = Enchurrada
block.meld-flurry.description = Carrega e lança canisters de Carbolito que explodem após um delay.\n[accent]Alto dano contra projetores de força[]\n\n[red]Perigo: Inserir materiais durou ou grundentos vai entupir a máquina![]\n\n[accent]Armadurado![]

block.meld-molotov.name = Molotov
block.meld-molotov.description = Lança uma casca de Prata carregada com [#cbdbfc]Aspectro[] contra alvos terrestres sobre longas distâncias. \n[accent]Alto dano de penetração de armadura.\nDobra o dano que unidades armaduradas recebem![]


block.meld-grandeur.name = Grandor
block.meld-grandeur.description = Lança bolas de materiais compactos contra alvos sobre vastas distâncias \n[accent]Pouca penetração de armadura\n\nEfeitos variam a depender da munição usada[]

block.meld-downpour.name = Torrencial
block.meld-downpour.description = Aniquila alvos terrestres com 30 espinhos de Prata cheios de [#89828c]Mercúrio[]. Baixa velocidade de recarga \n[accent]Alto dano explosivo e alta penetração de armadura. Inflinge evenamento de Mercúrio![]

block.meld-vivalo.name = Vivalo
block.meld-vivalo.description = Atomiza e dispara um turbilhão de partículas cristalinas que penetram armadura. [accent]\n\nVelocidade de rotação alta e é mais eficientemente resfriada.\n\nEfeitos variam a depender da munição usada, inflingindo laceração ou quebradiço[] 
block.meld-vivalo.details = Esse design foi feito para ser o mais leve possível para que fosse construído rapidamente e usado no mesmo instante. Cristais são triturados na base, armazenado em um container para alimentação rápida e então acelerada. O container no lado oposto do acelerador para mudar o centro de massa para seu meio, permitindo rotação rápida. A fragilidade do design foi compensada com paredes em sua frente, mas dano contínuo irá rapidamente destrui-lo

block.meld-vivisection.name = Vivisecção
block.meld-vivisection.description = Monta e lança disco-serras de [#4bb66b]Resonaro[].\n[accent]Inflinge laceração em alvos não armadurados[]

block.meld-tantrum.name = Fend-o-Trauma
block.meld-tantrum.description = Compacta e bafora [#8872da]Fenda[] Usando um pistão de Prata, causando empurrão pesado.\n[accent]Reduz o arrasto do alvo[]

block.meld-earthbound-infuser.name = Infusor Enriquecedor
block.meld-earthbound-infuser.description = Mistura Detritos com gases de aberturas no solo para sintetizar Carbolito.\n\nRequer [#cbdbfc]Aspectro[] para funcionar.

block.meld-heating-basin.name = Tanque de Aquecimento
block.meld-heating-basin.description =  Bombeia [#b89f47]Nectar[] através de canos cobertos de pó de Carbolito sobre fontes geotermais para extrair [#89828c]Mercúrio[], produzindo Detritos como subproduto.

block.meld-peat-masher.name = Espreme-Turfa
block.meld-peat-masher.description = Tritura Massa Compactada extraindo Vinhas Espinhentas and Massa Faminta no processo.\n\nRequer [#cbdbfc]Aspectro[] e [#89828c]Mercúrio[] para funcionar. Age como roteador de fluido para [#89828c]Mercúrio[] e [#cbdbfc]Aspectro[].\n\n[accent]Produz mais [#89828c]Mercúrio[] do que consome quando operando sobre fontes geotermais[]

block.meld-bramble-press.name = Prensa de Espinhos
block.meld-bramble-press.description = Pressiona Vinhas Espinhentas para produzir [#89828c]Mercúrio[], produzindo pequenas quantias de [#89413e]Gosma[]. Age como um roteador de [#89828c]Mercúrio[]\n\n[accent]pouca armadura[]

block.meld-electrum-amalgamator.name = Amalgamador de Electrum
block.meld-electrum-amalgamator.description = Bombardeia depósitos de ouro nativo com [#cbdbfc]Aspectro[], usando [#89828c]Mercúrio[] para extrair um amalgama do pó, logo combina a mistura com Prata e Detritos para criar Electrum.\n\nProduz um pouco de [#e6c700]Icor[] como subproduto.\n\n[accent]Requerimento de líquidos se baseia na eficiência.[]
block.meld-electrum-amalgamator.details = An alternative to mining Electrum off the walls. Though not very efficient,  itt'll have to do.

block.meld-amalgam-decomposer.name = Decompositor de Amalgamador
block.meld-amalgam-decomposer.description = Tritura Electrum e o bombardeia usando altas quantidades de [#cbdbfc]Aspectro[] até o que sobrar ser um pedaço de Detritos e [#e6c700]Icor[].
block.meld-amalgam-decomposer.details = Isto não parece mais feliz?\nAcho que sim, mas o que é isso na direita?\nNão contaram a você? É um cristal de Dissonitra.\n...Isso não é o que eles pulverizam na-\n[red]<FIM DE GRAVAÇÃO>[]

block.meld-dissonance-inducer.name = Indutor de Dissonância
block.meld-dissonance-inducer.description = Imita um ambiente sendentário para encubação de Dissonitra para [#ea9ad6]Meld[], criando pacotes de cristais, e liberando [#cb8650]Éter[] no processo.\n\nRequer Resonaro e [#8872da]Fenda[] para funcionar.

block.meld-warp-aggregator.name = Agregador de Dobra
block.meld-warp-aggregator.description = Processa massiva quantidades de residuos de vidro sobre [accent]fontes geotermais[] produzindo [#b460e2]Dobra[].\n\nRetorna uma quantidade notável e útil de residuos de vidro.
block.meld-warp-aggregator.details = ...É uma caixa.\n\numa caixa que constrói\n\num caixote?\n\nbem, é uma tremenda caixa fabricante...

block.meld-glassblower.name = Sopra Vidro
block.meld-glassblower.description = Derrete glóbulos e os extrusa em um fino tecido de vidro, liberando [#cb8650]Éter[] no processo.\n\nRequer Riplom e energia para funcionar.\n\n[accent]Requerimento de líquidos se baseia na eficiência[]

block.meld-vitric-weaver.name = Costurador Vítrico
block.meld-vitric-weaver.description = Costura Dissonitra em um fino tecido cristalino.\n\nDesembaralha [#8872da]Fenda[] inserido em [#cb8650]Éter[] no processo, precisando de Riploma para funcionar.\n\n[accent]Requerimento de líquidos se baseia na eficiência.[]

block.meld-brick-conglomerator.name = Plataforma de Conglomeração
block.meld-brick-conglomerator.description = Esmaga Carbolito mistura com gases de fontes geotermais e [#e6c700]Icor[], e então prensa o slurry em Tijolos. Requer [#cbdbfc]Aspectro[] para funcionar.


block.meld-silver-husk.name = Casca de Prata
block.meld-silver-husk.description = Provem cobertura contra fogo inimigo. Se regenera aos poucos quando provido de [#cbdbfc]Aspectro[].\n\n[accent]Levemente Armadurado[]

block.meld-barricade.name = Barricada
block.meld-barricade.description = Provem cobertura contra fogo inimigo.\nRápido de construir.\n\nManeira simples de armazenar Tijolos Compactos/Gosma Pétrea fora do núcleo para uso em obras.\n\n[accent]Armadurado.[]

block.meld-sandbank.name = Bolsas de Areia
block.meld-sandbank.description = Provem cobertura contra fogo inimigo.\nAbsorve muito dano, mas recebe dano extra a cada ataque.\n\n[red]Squishi! (45)[]
block.meld-sandbank.details = Se lesmas rosas podem construir paredes de argila, Por que nós não!\nPorque... Você tem um ponto

block.meld-nullifier.name = [red]Nullificador
block.meld-nullifier.description = Constroi uma carga cheia de [#cbdbfc]Aspectro[] mortal que [red]decima[] construções e unidades hostis.\n\n[red]Aniquila seus arredores ao explodir, não chegue perto!![]

block.meld-sonar-spire.name = Torre Sonar
block.meld-sonar-spire.description = Demora um momento para se construir, e então periodicamente pulsa ondas sonares! n\Garante visão
block.meld-sonar-spire.details = Inicialmente um sinalizador de Éter construida para ajudar viajantes a acharem seus destinos, morfado em uma construção importante para "Reunir" tropas biológicas e mecânicas.


block.meld-movement-anchor.name = Âncora de Movimento
block.meld-movement-anchor.description = Pulsa um campo que [accent]Âncora[] unidades. Aplica [accent]Rebote[] para unidades aliadas.

block.meld-mercurial-diffuser.name = Difusor de Mercúrio
block.meld-mercurial-diffuser.description = Libera nuvens de mercúrio que intoxicam unidades [#ea9ad6]Meld[]. Aplica revestimento de [#89828c]Mercúrio[] em unidades aliadas.

block.meld-ping-tower.name = Torre de Pulsos
block.meld-ping-tower.description = Usa Detritos para disparar esplosões de pulsos sonar que marcam inimigos através da névoa\n\nRequer uma larga quantidade de [#cbdbfc]Aspectro[] para funcionar, ficando mais rápido quanto maior o suplimento.
block.meld-ping-tower.details = Embora incapaz de Reunir aliados, ajudou a obter informação vital sobre unidades [#ea9ad6]Meld[] e suas posições. Achar fraquezas nas ondas de ataque dos inimigos pode ser vital para sobrevivência.

block.meld-overseer-fabricator.name = Fabricador de Observador
block.meld-overseer-fabricator.description = Usa pedaços de detritos para produzir unidades [accent]Observadores[] temporarias para assistir em construções e [accent]Reunir[] aliados próximos.\n\nRequer grandes quantidades de [#cbdbfc]Aspectro[] para funcionar, ficando mais rápido quanto maior o suplimento.
block.meld-overseer-fabricator.details = Um modelo mais velho da Torre Sonar.\nEmbora pouca, a demanda de detrito ficou muito restritiva para certos locais, então uma nova construção foi desenvolvida para ajudar a revelar áreas de importância.

block.meld-fluid-sprayer.name = Sprayer de Fluídos
block.meld-fluid-sprayer.description = Continuamente carrega e dispara uma explosão de projeteis que espalham líquido em seu percuso.\n[accent]Só funciona acima de 75% de pressão![]

block.meld-environmental-drencher.name = Encharcador de Ambiente
block.meld-environmental-drencher.description = Continuamente carrega e dispara um anel de projeteis que espalham líquido enquanto viajam.\n[accent]Só funciona acima de 83% de pressão![]

block.meld-debris-slate.name = Placa de Detrito
block.meld-debris-slate.description = Bloco de mensagem. Sim.\n\n[gray]Se esse mod ja não era um mod meme o suficiente, bem...[]

block.meld-chute.name = Escotilha Esteira
block.meld-chute.description = Transporta itens para frente. Segura apenas um item.

block.meld-glasswork-chute.name = Escotilha Esteira Vidrada
block.meld-glasswork-chute.description = Forma, e então transporta pacotes de itens. Conduz energia como fios, velocidade dobrada quando energizado.
block.meld-glasswork-chute.details = Você queria uma esteira melhor? Aqui está.\n<Aviso: Pontes não inclusas>

block.meld-chute-router.name = Escotilha Roteadora
block.meld-chute-router.description = Roteia itens para três lados. Só aceita itens por trás. Pode ser configurado como um filtro.

block.meld-chute-crossing.name = Escotilha Cruzadeira
block.meld-chute-crossing.description = Permite que itens intersectem sem misturar entre si.\n\n[red]Esse bloco era pra tar no jogo mas o desenvolvedor do mod quer que você SOFRA![]

block.meld-chute-overflow.name = Escotilha de Sobracarga
block.meld-chute-overflow.description = Roteia itens para frente, envia para os lados caso bloqueado.

block.meld-chute-bridge.name = Escotilha Ponte
block.meld-chute-bridge.description = Move itens atráves de um único bloco. Ultrapassa terreno.

block.meld-chute-unloader.name = Escotilha de Descarregamento
block.meld-chute-unloader.description = Descarrega o item selecionado para blocos adjacentes.\n[accent]Funciona em núcleos![]

block.meld-unloading-hub.name = Hub de Descarregamento
block.meld-unloading-hub.description = Descarrega o item selecionado para saidas adjacentes.\n[accent]Armadurado pesadamente![]\n\n[]Funciona em núcleos![]\n\n[red]Danifica Blocos em volta quando destruído![]
block.meld-unloading-hub.details = Isso vai custar [#cbdbfc]Aspectro[] para funcionar no port Java, hehehe~

block.meld-channel-face.name = Face de Encanamento
block.meld-channel-face.description = Funciona como junção para líquidos. Transmite fluido sem armazenar. Sem risco de explodir.

block.meld-channel-node.name = Nodo de Encanamento
block.meld-channel-node.description = Age como roteador de líquidos. Líquidos podem sair e chegar em qualquer direção. Armazena uma pequena quantia de líquido.

block.meld-aspect-outlet.name = Tomada de Aspectro
block.meld-aspect-outlet.description = Descompressa [#cb8650]Éter[] em [#cbdbfc]Aspectro[] altamente volátil . Funciona como um terminal de saída para uma rede de fluidos.

block.meld-channel-director.name = Canal Direcionador
block.meld-channel-director.description = [red]Restringe[] Restringe pela metade a saida de líquido recebido.\n\nPode [red]detonar[] Nodos de Encanamento Cheios de [#cbdbfc]Aspectro[].\n[accent]Transporta a 50% de pressão.[]\n\n[red]Vai explodir em corrente![]

block.meld-channel-director-pressurized.name = Canal Direcionador Pressurizado
block.meld-channel-director-pressurized.description = Funciona como um condutor. Transmite fluidos de um lado para o outro. Armazena uma pequena quantidade de líquido.\n[accent]Transporta a 200% de pressão.[]\n\n[red]Vai explodir em corrente![]

block.meld-blossoming-channel.name = Canal Florescente
block.meld-blossoming-channel.description = Funciona como um condutor. Transmite fluidos de um lado para o outro. Armazena uma pequena quantidade de líquido.\n[accent]Transporta a 500% de pressão.[]\n\n[red]Vai explodir em corrente![]

block.meld-compartmentalized-node.name = Nodo Compartimentalizado
block.meld-compartmentalized-node.description = Funciona como um roteador de fluidos. Líquidos podem entrar e sair em qualquer direção.\n\nArmazena separadamente [#b89f47]Nectar[], [#89828c]Mercúrio[], [#7d312f]Sangue[] e [#89413e]Gosma[]. Quando alimentado com Detritos e o armazem estiver cheio, aos poucos drena seus conteudos.
block.meld-compartmentalized-node.details = Yes, it's dumb that the name goes one character off the UI frag. I'm triggered by this too.

block.meld-channel-hub.name = Hub de Encanamento
block.meld-channel-hub.description = Funciona como um roteador de fluidos. Líquidos podem ser inseridos e sairem de qualquer direção.\n\nArmazena um total de 100 nodos de fluido.

block.meld-filtration-unit.name = Unidade de Filtração
block.meld-filtration-unit.description = Funciona como filtro. Libera [#89828c]Mercúrio[] em qualquer lado.\n\nQuando alimentado com [#cbdbfc]Aspectro[] enquanto contem [#89828c]Mercúrio[], filtra Detritos de Massa Faminta [#7d312f]Sangue[] e [#b89f47]Nectar[], produzindo [#89828c]Mercúrio[] no processo.\n\n[accent]Para de funcionar quando pressurizado com [#89828c]Mercúrio[]![]

block.meld-neutralization-chamber.name = Câmara de Neutralização
block.meld-neutralization-chamber.description = Usa [#89828c]Mercúrio[] e Carne Anciã para absorver [#7d312f]Sangue[], produzindo mínimas quantidades de energia no processo.\nFunciona como um roteador de fluidos para [#7d312f]Sangue[].\n\n[scarlet]Explode quando completamente pressurizado com [#7d312f]Sangue[]!

block.meld-conductive-pile.name = Pilha Condutiva
block.meld-conductive-pile.description = Molas de Electrum empilhadas que são condutivas. Descubra para que serve.\n\n[accent]E eu acho que armazena um pouco de energia[]\n\n[red]...Frágil? (80)[]

block.meld-connector.name = Connector
block.meld-connector.description = Projeta raios que dividem energia entre o nodo e o alvo.\n\n[accent]Levemente armadurado[]

block.meld-substation.name = Substação
block.meld-substation.description = Projeta um raio que divide energia entra a Substação e alvo. Armazena energia em um buffer interno.\n\n[accent]Levemente Armadurado![]

block.meld-powerbank.name = Powerbank
block.meld-powerbank.description = Armazena grandes quantidades de energia e libera em momentos de déficit.
block.meld-powerbank.details = Acumula [#cb8650]Éter[] da atmosfera enquanto estimula Dissonitra, e queima ela como [#cbdbfc]Aspectro[] quando energia acaba.\n\nDeve haver alguma estrutura que gera energia diretamente usando [#cbdbfc]Aspectro[]...

block.meld-glass-burner.name = Queima Vidro [red](PS)
block.meld-glass-burner.description = Queima materiais a base de Dissonitra com pedaços de Riploma estabilizado com [#8872da]Fenda[], produzindo mínimas quantidades de energia.\n\n[red]sprite placeholder![]

block.meld-dissonance-discharger.name = Discharge Outlet [red](PS)
block.meld-dissonance-discharger.description = Crushes Dissonitre and focuses the resulting Aether into [#cbdbfc]Aspect[] efficiently using resonarum lenses, producing some power in the process.\n\n[scarlet]Explodes when fully pressurized with [#cbdbfc]Aspect[]![]\n\n[red]Placeholder Sprite![]


block.sludge-decomposer.name = Decompositor de Gosma
block.sludge-decomposer.description = Decomposita [#e6c700]Ícor[] e [#89413e]Gosma[], gerando energia e [#cbdbfc]Aspectro[].
block.sludge-decomposer.

block.meld-purification-chamber.name = Câmara de Purificação
block.meld-purification-chamber.description = Bombardeia Massa Faminta sobre fontes de calor, decompondo em [#7d312f]Sangue[], produzindo um pouco de energia no processo.\n\nRequer [#89828c]Mercúrio[] e [#cbdbfc]Aspectro[] para funcionar.\n\n[scarlet]Explode quando completamente pressurizado com [#7d312f]Sangue[]![]

block.meld-thermo-matting.name = Tapete Térmico [red](PS)[]
block.meld-thermo-matting.description = Passivamente obtem energia da digestão de meld sobre fontes de [#e6c700]Ícor[], extraindo [#e6c700]Ícor[] no processo.\n\n[red]SPRITE PLACEHODER[]
block.meld-thermo-matting.details = ... Não parece produzir nenhum resíduo

//Production
block.meld-aether-accumulator.name = Acumulador de Éter
block.meld-aether-accumulator.description = Coleta [#cb8650]Éter[] de fontes apropiadas.

block.meld-crystal-cracker.name = Quebra-Cristal
block.meld-crystal-cracker.description = Quebra e abre cristais de Dissonitra sobre [accent]solo de aspectro[] como uma fonte de [#cb8650]Éter[].

block.meld-crush-weaver.name = Costurador Esmagador
block.meld-crush-weaver.description = Costura Dissonitra em Malha Vítrica "eficientemente". Requer [#cbdbfc]Aspectro[] para funcionar.
block.meld-crush-weaver.details = ...Nem eu sei como isso funciona, tenta advinhar!

block.meld-aether-cracker.name = Crackeador de Éter
block.meld-aether-cracker.description = Crackeia [#cb8650]Éter[] em [#8872da]Fenda[] sobre [accent]aberturas de ícor[]. Bombeia um pouco de [#e6c700]Ícor[] no processo. Divide [#cb8650]Éter[] em um lado respectivo. \n\n[accent]Fluídos excessivos são liberados para prevenir despressurização [red]Incluindo [#cb8650]Éter[] inserido![].[]

block.meld-vitric-stimulator-ruined.name = Estimulador Vítrico [lightgray](Arruinado)[]
block.meld-vitric-stimulator.description = Absorve [#8872da]Fenda[] de fontes apropiadas usando Malha Vítrica para purificar o ar, produzindo uma pequena quantidade de Resíduo Vidroso.\n\nRequer energia para funcionar.\n\n[orange]Infeficiente, Desconstrução é recomendada[]
block.meld-vitric-stimulator.details = Ah, se tivesse como extrair recursos dessas fontes...

block.meld-vitric-stimulator.name = Estimulador Vítrico
block.meld-vitric-stimulator.description = Absorve [#8872da]Fenda[] de fontes apropiadas usando Malha Vítrica para purificar o ar, produzindo uma substancial quantidade de Resíduo Vidroso.\n\nRequires Power to run.
block.meld-vitric-stimulator.details = Ah, se tivesse como extrair recursos dessas fontes...

block.meld-flarestack-filter.name = Filtro Flarestack
block.meld-flarestack-filter.description = Absorve [#8872da]Fenda[] de fontes apropiadas através da neutralização de impurezas no ar.\n\nRequer Resonaro e Riploma para funcionar.
block.meld-flarestack-filter.details = Neutraliza o Éter presente em uma [accent]fonte fendal[] tranformando-o em Aspectro e o explodindo com Riploma, mas requer alimentação constante de Lentes.

block.meld-filtrative-feeder.name = Alimentador Filtrador
block.meld-filtrative-feeder.description = Processa pacotes de [#e6c700]Ícor[] sobre [accent]pisos de meld[], adquirindo um pouco de [#ea9ad6]Meld[] e pedaços de Detritos a cada pacote processado.\n\nRequer um pouco de energia.\n\n[accent]Requerimento de líquidos inseridos dependem da eficiência.
block.meld-filtrative-feeder.details = Se você não consegue derrota-los...

block.meld-siphon.name = Sifão
block.meld-siphon.description = Bombeia [#89828c]Mercúrio[] de depósitos a [accent]metade de pressão[]. Usa tijolos compactos/Gosma Pétrea para reparar estabilidade. \n\nEstabilidade é [red]limited[] e depósitos irão quebrar se exaustada! \n\n[gray]Reparamentos de depósitos é um WIP e apenas será implementado se necessário.

block.meld-sap-extractor.name = Extrator de Seiva
block.meld-sap-extractor.description = Extraí [#b89f47]Nectar[] De fontes apropiadas. Precisa estar conectado a um [#BE7E60]Coração de Mangrávora[] ou uma [accent]Fissura de Nectar[] sobre pisos de Nectar ou Mércurio.

block.meld-displacement-pump.name = Bomba de Deslocamento
block.meld-displacement-pump.description = Derruba Detritos em corpos de fluídos produzindo vazão indefinidamente. Requer [#cbdbfc]Aspectro[] para funcionar.\n\n[accent]Armadurado[]

block.meld-elemental-blaster.name = Broca Elemental
block.meld-elemental-blaster.description = Bombardeia depósitos para produzir itens indefinidamente. Requer [#cbdbfc]Aspectro[] para funcionar.\n\nPode ser impulsionado com [#ea9ad6]Meld[] para dobrar velocidade de coleta.

block.meld-elemental-sampler.name = Coletor de Mostras Elemental
block.meld-elemental-sampler.description = Coleta amostras de depósitos indefinidamente. Requer [#cbdbfc]Aspectro[] e [#8872da]Fenda[] para funcionar.\n\nPode ser impulsionado com [#b460e2]Dobra[] para dobrar velocidade de coleta.\n\n[accent]Mais eficiente em materiais moles[]
block.meld-elemental-sampler.details = Isto quer voltar para casa.

block.meld-harbinger-of-decay.name = Extrator de Decandência
block.meld-harbinger-of-decay.description = Canaliza Meld diretamente das poças para seu armazém.
block.meld-harbinger-of-decay.details = Alguém quer mais Resonaro, hehehe~

block.meld-elemental-blaster.details = Desenvolvido tarde durante a incursão. Métodos prévios são falhos diante o corror das partes mecânicas.

block.meld-techno-dredger.name = Techno Draga
block.meld-techno-dredger.description = Coleta quantidade massivas de Tecno-Sucata. Requer [#cbdbfc]Aspectro[] para funcionar.

block.meld-earthen-grinder.name = Moedor Terrestre
block.meld-earthen-grinder.description = Esmaga pedra de paredes e mistura com [#b89f47]Nectar[] e [#8872da]Fenda[] para fazer Gosma Pétrea.


block.meld-elemental-folder.name = Dobrador de Electrum
block.meld-electrum-folder.description = Purifica e dobra depósitos nativos de Electrum em folhas. Capaz de processar depósitos envenenados por [#89828c]Mercúrio[].\n\nRequer [#cbdbfc]Aspectro[] para funcionar.

block.meld-pad-omega.name = Pad: Trencheira
block.meld-pad-omega.description = Posto da base. Apenas um pode estar ativo.\n[red]Não consegue suportar uma base sozinho.[]
block.meld-pad-omega.details = Uma memória dos belos dias passados

block.meld-pad-psi.name = Pad: Psi
block.meld-pad-psi.description = Posto da base. Apenas um pode estar ativo.\n[red]Não consegue suportar uma base sozinho.[]
block.meld-pad-psi.details = LLLLLLAASEEEERRR!!!!.

block.meld-pad-phi.name = Pad: Phi
block.meld-pad-phi.description = Posto da base. Apenas um pode estar ativo.\n[red]Não consegue suportar uma base sozinho.[]
block.meld-pad-phi.details = Proporção Áurea? O que é isso?

block.meld-core-raft-dormant.name = Núcleo: Jangada[lightgray](Dormente)[]
block.meld-core-raft-dormant.description = Núcleo da base. Permite que unidades passem por cima livremente. [accent]É acionado quando dentro de uma construção com energia.[]
block.meld-core-raft-dormant.details = Bunker barato com transporte de itens intra-setor e um radar implementado.

block.meld-core-raft.name = Núcleo: Jangada
block.meld-core-raft.description = Núcleo da base. Permite que unidades passem por cima livremente. Quando todos são destruídos, o setor é perdido.
block.meld-core-raft.details = Um belo Hub logístico. Equipado com propulsores de uso único.

block.meld-core-bunker.name = Núcleo: Bunker
block.meld-core-bunker.description = Núcleo da base. Permite que unidades passem por cima livremente. Quando todos são destruídos, o setor é perdido.
block.meld-core-bunker.details = Um belo Hub logístico. Equipado com propulsores de uso único.

block.meld-buffer.name = Buffer
block.meld-buffer.description = Armazena uma pequena quantidade de itens por tipo. Pode ser descarregado para utilizar seu conteúdo. Não se conecta ao núcleo.

block.meld-interface.name = Interface
block.meld-interface.description = Armazena uma pequena quantidade de itens por tipo. Pode ser descarregado para utilizar seu conteúdo. Pode se conectar ao núcleo!\n\nUnidades terrestres podem passar por cima.

block.meld-shark-factory.name = Auto-Forja de Tubarão
block.meld-shark-factory.description = Produz unidades Tubarão com Carbolito e Prata.\n\nRequer largas quantidades de [#cbdbfc]Aspectro[] para funcionar, ficando mais rápido a depender do quanto é suplimentado.

block.meld-remora-factory.name = Auto-Forja de Remora
block.meld-remora-factory.description = Produz unidades Remora usando Detritos, Electrum e Malha Vítrica.\n\nRequer largas quantidades de [#cbdbfc]Aspectro[] para funcionar, ficando mais rápido a depender do quanto é suplimentado.

block.meld-narwhal-factory.name = Auto-Forja de Narval
block.meld-narwhal-factory.description = Produz unidades Narval usndo Carbolito, Tijolos Compactados e Gosma Pétrea.\n\nRequer uma quantidade boa de [#cbdbfc]Aspectro[] e [#e6c700]Ícor[] para funcioanr, ficando mais rápido a depender do quanto é suplimentado.\n\n[accent]Levemente Armadurado[]

block.meld-hammerhead-factory.name = Bio-Forja de Cabeça-de-Martelo
block.meld-hammerhead-factory.description = Gesta rapidamente unidades Cabeça-de-Martelo usando Detritos, Riploma e Resonaro.\n\nRequer uma quantidade boa de [#8872da]Fenda[] e um pouco de [#cbdbfc]Aspectro[] para funcionar, ficando mais rápido a depender do quanto é suplimentado.

block.meld-astrea-factory.name = Auto-Forja de Astrea
block.meld-astrea-factory.description = Produz unidades Astrea usando Detritos e Electrum.\n\nRequer uma quantidade boa de [#cbdbfc]Aspectro[] e [#89828c]Mercúrio[] para funcionar, ficando mais rápido a depender do quanto é suplimentado.

//Manggrove blocks
block.meld-swamp-root-heart.name = [#BE7E60]Coração de Mangrávora[]
block.meld-swamp-root-heart.description = Pode-se extrair [#b89f47]Nectar[]. Nunca muda de forma.\n\n[red]Não pode ser desconstruído.\n\nDeve ser escolhido como alvo para ser atacado diretamente![]

block.meld-swamp-root-dormant.name = [#BE7E60]Raiz de Mangrávora (Dormente)[]
block.meld-swamp-root-dormant.description = Pode [#89828c]Florescer[] ou [#4181B9]Brotar Folhas[]. Aumenta a quantidade global de unidades do pântano.\n\n[red]Não pode ser desconstruído.\n\nDeve ser escolhido como alvo para ser atacado diretamente![]

block.meld-swamp-mangrove-large.name = [#BE7E60]Efígie de Mangrávora[]
block.meld-swamp-mangrove-large.description = Funciona como um Hub de recursos no pântano..

block.meld-swamp-mangrove-large-awake.name = [#4181B9]Efígie de Mangrávora despertada[]
block.meld-swamp-mangrove-large-awake.description = Funciona como um Hub de recursos do pântano. Espalha sangue através do Lodo.

block.meld-swamp-plant-thorn-crawler.name = [#BE7E60]Rastejador[] [#89828c]Espinhento[]
block.meld-swamp-plant-thorn-crawler.description = Dispara duas explosões de espinhos em três direções. Explode em uma poça de [#b89f47]Nectar[] e gotas de [#89413e]Gosma[] Após destruição.

//Meld blocks

block.meld-meld-node.name = Nodo Meld
block.meld-meld-node.description = Mantém a área circundante congelada. Ponto de spawn para unidades [#ea9ad6]Meld[] durante ondas.

block.meld-meld-surpressor.name = Suppressor Meld
block.meld-meld-surpressor.description = Mantém a área circundante congelada. Construido no topo de zonas de núcleo. Ponto de spawn para unidades [#ea9ad6]Meld[] durante ondas.\n\n[red]Armadurado[]

block.meld-meld-synapse.name = Sinapse Meld
block.meld-meld-synapse.description = Estabiliza barreiras de cristais circundantes. Quando não ouver mais nenhuma sinapse, toda parede sucumbe.

block.meld-meld-capsule.name = Capsula meld
block.meld-meld-capsule.description = Projeta uma barreira contra ataques físicos. Requer [#ea9ad6]Meld[] em estado gasoso para funcionar.

block.meld-meld-amplifier.name = Amplificador Meld
block.meld-meld-amplifier.description = Pulsa [#ea9ad6]Amplificação[] para aliados no alcance.

block.meld-meld-beacon.name = Beacon Meld
block.meld-meld-beacon.description = Fumiga a área circundante com [#ea9ad6]Meld[] tornando qualquer construto em volta bastante durável, enquanto danifica aos poucos inimigos dentro de sua área de alcance.
block.meld-meld-beacon.details = Geralmente encontrado em depósitos de Detritos.

block.meld-pipeline.name = Encanação
block.meld-pipeline.description = Construto Meld que funciona como um cano.

block.meld-pipeline-router.name = Encanação Roteadora
block.meld-pipeline-router.description = Construto Meld que funciona como um roteador de fluídos.

block.meld-pipeline-overpass.name = Encanamento Ponte
block.meld-pipeline-overpass.description = Construto Meld que funciona como uma ponte.

block.meld-pipeline-crossing.name = Encanamento Cruzador
block.meld-pipeline-crossing.description = Construto Meld que funciona como uma junção de líquidos.

block.meld-blocker.name = Barreira de Cristal
block.meld-blocker.description = Formação quase indestrutível de [#ea9ad6]Meld[]. Comumente destruídos após a destruição de uma Sinapse, Ou do chão derretendo abaixo.\n\n[red]Altamente Armadurado[]

block.meld-blocker-large.name = Barreira de Cristal Larga
block.meld-blocker-large.description = Formação quase indestrutível de [#ea9ad6]Meld[]. Comumente destruídos após a destruição de uma Sinapse, Ou do chão derretendo abaixo.\n\n[red]Altamente Armadurado[]

block.meld-stone-blocker.name = Barreira Carbônica
block.meld-stone-blocker.description = Formação artificial de [accent]Pedra de Carbono[]. Comumente destruído após a destruição de uma sinapse ou sustentação de dano contínuo.\n\n[red]Altamente Armadurado[]

block.meld-stone-blocker-large.name = Barreira Carbônica Larga
block.meld-stone-blocker-large.description = Formação artificial de [accent]Pedra de Carbono[]. Comumente destruído após a destruição de uma sinapse ou sustentação de dano contínuo.\n\n[red]Altamente Armadurado[]

block.meld-mallow-blocker.name = Barreida de Malva
block.meld-mallow-blocker.description = Formação artificial de [accent]Areia de Malva[]. Comumente destruído após uma explosão, ou por sustentação de dano contínuo.\n\n[red]Frágil! (60)[]

block.meld-mallow-blocker-large.name = Barreira de Malva Larga
block.meld-mallow-blocker-large.description = Formação artificial de [accent]Areia de Malva[]. Comumente destruído após uma explosão, ou por sustentação de dano contínuo.\n\n[red]Frágil! (60)[]

block.meld-meld-cultivator.name = Cultivador Meld
block.meld-meld-cultivator.description = Abriga bolhas que liberam [#ea9ad6]Meld[] em seu estado gasoso.

block.meld-meld-pumpjack.name = Bombeadora Meld
block.meld-meld-pumpjack.description = Coleta quantidades industriais de [#e6c700]Ícor[].

block.meld-aether-compressor.name = compressor de Éter
block.meld-aether-compressor.description = Abriga [#ea9ad6]Meld[] que compacta o [#cb8650]Éter[] ao redor no interior do construto.

block.meld-spawning-pool.name = Piscinas de Produção
block.meld-spawning-pool.description = Usa quantidades massivas de [#e6c700]Ícor[] Para incubar larvas.

block.meld-jilla-incubator.name = Incubador de Jilla
block.meld-jilla-incubator.description = Sepulta pares de Larvas dentro de cristais em ambientes de [#cb8650]Éter[] para formar construtos Jilla.\nExplode e libera um Gilla e um par de Killas quando destruído.
block.meld-jilla-incubator.details = Não é um bom lugar para viver...

block.meld-craig-incubator.name = Incubador de Craig
block.meld-craig-incubator.description = Forma cascas metálicas em trios de Larva dentro de ambientes de [#cb8650]Ícor[] para formar construtos Craig. Pedra residual é transformada em um Afraig a cada pacote processado.\nExplode em diversos Craigs e Afraigs quando destruído.\n\n[red]Levemente Armadurado[]
block.meld-craig-incubator.details = Não é a maneira comum de produzir Craigs, ja que geralmente Bolhas são feitas para possuirem os contrutos.

block.meld-gilla-incubator.name = Incubador de Gilla
block.meld-gilla-incubator.description = Sepulta pares de Larvas dentro de cristais em ambientes de [#cb8650]Éter[] para formar construtos Gilla.\nExplode em um Gilla eum par de Killas quando destruído.
block.meld-gilla-incubator.details = Not a suitable place to live...

block.meld-meld-cluster-large.name = Conjunto Largo de Meld
block.meld-meld-cluster-large.description = Uma pilha de [#ea9ad6]Meld[] que sobre-cresceu no topo de uma fonte de [#cb8650]Éter[]. Uma boa fonte de Detritos inicial.

block.meld-craig-coffer.name = Cofre Craig
block.meld-craig-coffer.description = Explode em Craigs após destruição. Atira contra alvos inimigos próximos, recebendo dano no processo sem Meld.

block.meld-jilla-coffer.name = Cofre Jilla
block.meld-jilla-coffer.description = Explode em Jillas quando destruídos.

block.meld-braig-coffer.name = Cofre Braig
block.meld-braig-coffer.description = Explode em Braigs após destruição. Trava na posição do alvo, e logo dispara múltiplas pedras em alvos.

block.meld-pointago-coffer.name = Cofre Pointago
block.meld-pointago-coffer.description = Explode em múltiplos Pointagos quando destruído. Trava na posição do alvo, e logo dispara 3 pedras afiadas.

block.meld-meld-cannon.name = Canhão Meld
block.meld-meld-cannon.description = Lança pacotes altamente compressados de Éter em alvos.

block.meld-meld-spewer.name = Enchurrador Meld
block.meld-meld-spewer.description = Dispara Jets concentrados de [#e6c700]Ícor[] contra alvos causando knockback concentrado, Curando qualquer bloco aliado no processo.

block.meld-tracker-encampment.name = Acampamento de Perseguidor
block.meld-tracker-encampment.description = Lança misseis larvais que causam dano extra em contato direto. Desaloja de sua base quando destruído.\n\n[red]Altamente Armadurado[]

block.meld-scorcher-nest.name = Ninho de Abrasador
block.meld-scorcher-nest.description = Cristaliza um cristal de abrasador, que alimenta quatro turbinas de fogo independentes. explode em múltiplos abrasadores quando destruído.

bloock.meld-splurger-nset.name = Ninho de Splurger
bloock.meld-splurger-nset.description = Dispára pacotes de Splurgers com tempo de vida limitado.
bloock.meld-splurger-nset.details = gosmento...?

//Fringe blocks

block.meld-aether-plug.name = Conector de Éter
block.meld-aether-plug.description = Sifona [#cb8650]Éter[] de fontes apropiadas.

block.meld-data-coagulator.name = Coagulador de Informação
block.meld-data-coagulator.description = Escreve largas quantidades de [#9ccaed]Data Líquida[] em folhas de Tecno-Sucata Para criar Fragmentos.

block.meld-rubble-refinery.name = Refinaria de Destroços
block.meld-rubble-refinery.description = Bombardeia e centrifuga Destroços industriais para recurso essenciais.\n\nRequer [#cbdbfc]Aspectro[] para funcionar.

block.meld-metal-siev.name = Peneira Metálica
block.meld-metal-siev.description = Filtra Destroços industriais para produzir Prata e Electrum, produzindo Massa Faminta no Processo.\n\nRequer [#89828c]Mercúrio[] para funcionar.

block.meld-container.name = Container
block.meld-container.description = Armazena uma pequena quantidade de itens por tipo.

block.meld-crate.name = Caixote
block.meld-crate.description = Armazena uma quantidade de itens por tipo.
block.meld-crate.details =  Geralmente utilizado como armazem de compostos industriais.

block.meld-drill-turret.name = Torreta Brocadeira
block.meld-drill-turret.description = Foca [#cbdbfc]Aspectro[] em um raio devastador que penetra armadura.

block.meld-repair-turret.name = Torreta de Reparo
block.meld-repair-turret.description = Foca [#cbdbfc]Aspectro[] em pacotes de reparo.

block.meld-shield-battery.name = Bateria Escudo
block.meld-shield-battery.description = Solta [#9ccaed]Data Líquida[] misturada, geralmente conectadas a Barreiras de Força. Requer [#cbdbfc]Aspectro[] para funcionar, e um pouco de [#9ccaed]Data Líquida[] inicial.
block.meld-shield-battery.details = Data infinita inútil.

block.meld-access-point.name = Ponto de Acesso
block.meld-access-point.description = Se conecta a um Encriptador para energiza-lo.
block.meld-access-point.details = Não tenho certeza de como isso funciona...

block.meld-encrypter.name = Encriptador
block.meld-encrypter.description = Coleta [accent]Fragmentos[] e [accent]Fragmentos de Memórias[]. 
block.meld-encrypter.details = Não sério, como que "encriptar" informação produz fragmentos de memória? Não deveria produzir Tecno-Sucata?

block.meld-data-miner.name = Minerador de Data
block.meld-data-miner.description = Se conecta a núcleos de Data expostos, e minera pequenas quantidades de [#9ccaed]Data Líquida[]. 
block.meld-data-miner.details = Also if Liquid Data is raw data then is encryption inserting liquid data into a medium or is it changing it somehow.

block.meld-decryption-module.name = Módulo de Descriptografia
block.meld-decryption-module.description = Se conecta a núcleos de dados expostos, e rapidamente puxa [#9ccaed]Data Líquida[] de [accent]Tecno-Sucata[] usando pequenas quantidades de [#9ccaed]Data Líquida[].
block.meld-decryption-module.details = Sério, quem pensou nesses nomes???

block.meld.data-coagulator.name = Coagulador de Data
block.meld-data-coagulator.description = Deposita quantidades massiva de Data em Tecno-Sucata. O processo consome Tecno-Sucata excessiva.
block.meld-data-coagulator.details = Wait so if storage is Technoscrap which results in Fragments, then are memory shards like encrypted zip bombs?

block.meld-indoctrinator.name = Indotrinador
block.meld-indoctrinator.description = Deixa [accent]Tecno-Sucata leve e transforma em [accent]Pedaços Ralados[]
block.meld-indoctrinator.details = VOCÊ PERDE MATERIAL PRODUZINDO ISSO???

//Parts

block.meld-p-part-a0-0a-data-resonator.name = Resonador de Data
block.meld-p-part-a0-0a-data-resonator.description = Célula de combustível que provém energia para habilidades de movimentação.

block.meld-p-part-a0-1a-targeting-matrix.name = Matriz de Alvos
block.meld-p-part-a0-1a-targeting-matrix.description = Possui um processador capaz de processamentos de alvos mais avançada como reparar struturas aliadas ou assistência em construções.

//environmental blocks

//storm planes

block.meld-storm-dissonitre-cluster.name = Conjunto de Dissonitra
block.meld-storm-dissonitre-cluster.description = Conjunto Vítrico, brilha quando infundido com [#cb8650]Éter[]. Boa fonte de dissonitra. Cresce novamente ao ser atingido por um raio.
block.meld-storm-dissonitre-cluster.details = So uh... factory?

block.meld-mallow-cluster-large.name = Conjunto de Malva Largo
block.meld-mallow-cluster-large.description = Explode quando destruído, espalhando Dissonitra em unidades próximas.
block.meld-mallow-cluster-large.details = Então... Uma fábrica?

