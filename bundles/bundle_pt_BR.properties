block.meld-peat-mangrove-chunks-planty.name = Massa Compactada
block.meld-peat-mangrove-chunks-awoken.name = Carne-Anciã Florescente

block.meld-gale-wall.name = Parede Vendaval
block.meld-gale-shale-wall.name = Muralha de Xisto Vendaval
block.meld-gale-shale.name = Xisto Vendaval

block.meld-resonant-stone-wall.name = Parede de Pedra e Resonaro

//Items

item.meld-debris.name = Detritos
item.meld-debris.description = Usado em diversos tipos de construtos em Ikaru. Refinável.
item.meld-debris.details = Pedaços de metal que o [#ea9ad6]Meld[] não consegui digerir.

item.meld-carbolith.name = Carbolito
item.meld-carbolith.description = Usado como suporte estrutural e combustível.
item.meld-carbolith.details = Pedra rica em carbono, não chega a ser grafita. Diferente da medicação.

item.meld-tenbris.name = Tenbrio
item.meld-tenbris.description = Material cru, valioso por sua capacidade de insular Aspectro quando refinado.
item.meld-tenbris.details = Hematita infundida de gases, mais maleável e menos quebradiçp porém mais duro que o normal.

item.meld-elnar-dust.name = Poeira Elnar
item.meld-elnar-dust.description = Material cru, valioso por sua capacidade de conduzir Aspectro.
item.meld-elnar-dust.details = Comumente encontrada se acumulando como rastros em fluxos que passam por depósitos ricos em Elnar.\n\nMineral Nativo de Ikau, com composição desconhecida, provavelmente Aspectro...

item.meld-compacted-brick.name = Tijolos Compactados
item.meld-compacted-brick.description = Usado como forma de concreto para fundações de construções e infraestrutura de energia junto com Gosma Pétrea e Electrum Folheado.
item.meld-compacted-brick.details = Bonk!

item.meld-stony-gloop.name = Gosma Pétrea
item.meld-stony-gloop.description = Usado como argamassa em fundações de construções e infraestrutura de energia junto com Tijolos Compactados e Electrum Folheado.
item.meld-stony-gloop.details = Bloop!

item.meld-silver.name = Prata
item.meld-silver.description = Utilizado em componentes elétricos e estruturas. Parte integral na maioria de unidades básicas.
item.meld-silver.details = Mão digerido por [#ea9ad6]Meld[].\n\nUma bela cápsula para [#cbdbfc]Aspectro[].

item.meld-electrum-sheet.name = Electrum Folheado
item.meld-electrum-sheet.description = Material refinado utilizado em produção de energia e de unidades avançadas.
item.meld-electrum-sheet.details = Also functions as a capsule for [#cbdbfc]Aspect[].

item.meld-vitric-mesh.name = Malha Vítrica
item.meld-vitric-mesh.description = Um pedaço de vidraria intricada que captura [#cb8650]Éter[] quando estimulado com energia, se construindo em si mesmo.
item.meld-vitric-mesh.details = O design possui origem Meldiana, visto primeiramente sendo costurada pelas criaturas naticas das terras áridas. Seu propósito é desconhecido.

item.meld-shiny-globule.name = Glóbulos Brilhantes
item.meld-shiny-globule.description = Resquicios de vidro derretido e solidificado em glóbulos brilhantes. O ideal é descartar com segurança, ou recicla-lo.
item.meld-shiny-globule.details = Resquicios do que fora uma vez uma vidraria incrível.\n\nUm fénomeno natural interessante. Parece pulsar com um fraco mas forte brilhar laranja.

item.meld-stormstruck-shell.name = Casca Tempestada
item.meld-stormstruck-shell.description = Uma costura cristalina de Dissonitra envoltado por um conjunto de Resonaro polido.\nAltamente Instável...
item.meld-stormstruck-shell.details = Uma abominação inatural de duas forças opostas, Grudadas por uma força desconhecida.

item.meld-resonarum.name = Resonaro
item.meld-resonarum.description = Usado em aplicações de alta energia de [#cbdbfc]Aspectro[] como os [red]Nullificadores[].
item.meld-resonarum.details = Pulsa com uma estranha energia verde. Parece remendar a si mesmo.

item.meld-dissonitre.name = Dissonitra
item.meld-dissonitre.description = Uma rara alternativa para fontes de [#cb8650]Éter[] extraido dos Planos Tempestuosos e as Terras Áridas. Um pouco Instável.
item.meld-dissonitre.details = Produz um som de "click" distorcido

item.meld-clay-mallow.name = Argila-Malva
item.meld-clay-mallow.description = Argila das Terras Áridas. Facilmente moldado em containers, mas díficil de se extrair.
item.meld-clay-mallow.details = Substância valiosa por sua maleabilidade e habilidade de manter seu formato, junto de sua textura veludosa.

item.meld-riplom.name = Riploma
item.meld-riplom.description = Xisto dos Planos Tempestuosos. Um ótimo fluxo para vidrarias, mas sem muito uso prático. Um pouco Volátil.
item.meld-riplom.details = Um pouco similar a fungos. Parece absorver [#cbdbfc]Aspectro[] de seu redor.

item.meld-riploko.name = Riploko
item.meld-riploko.description = Riploma que foi infundido de [#cbdbfc]Aspectro[]. Pronto para explodir!
item.meld-riploko.details = Ah não...

item.meld-technoscrap.name = Tecno-Sucata
item.meld-technoscrap.description = Usada em logística de armazém avançada e blocos de núcleos simples.
item.meld-technoscrap.details = Usado como meio de armazenamento de Data. Possui largas quantidades de Datas escritas sobre sua formação.\nTem Data nas paredes... Delicioso!

item.meld-grating-chunk.name = Conjunto Gradeado
item.meld-grating-chunk.description = Nenhum uso aparente encontrado. Serve de paineis para as fábricas que se estendem por Ikaru.
item.meld-grating-chunk.details = Apesar da descrição que visa informar sobre a utilidade dos chunks, grandes quantidades deles servem como base para a maioria das nossas estruturas. Embora as informações sobre essa tecnologia estejam bloqueadas para você, explore os bancos de dados. Eles lhe ensinarão como produzir e usar esses chunks.

item.meld-fragment.name = Fragmento
item.meld-fragment.description = Usado para desfragmentar bases de Data e desbloquear novas tecnologias, e em produção de unidades avançadas.
item.meld-fragment.details = Variada e desorganizado pedaços de Data de incursões prévias. Geralmente mais útil do que não.

item.meld-memory-shard.name = Fragmento de Memória
item.meld-memory-shard.description = Usado para desfragmentar bases de Data e desbloquear novas tecnologias, e em certas fontes de Data Líquida.
item.meld-memory-shard.details = Pedaços raros de Tecno-Sucata que vazam [#9ccaed]Data Líquida[] organizada no céu. Aparentam surgir de bancos de Data defeituosos, embora o fénomeno exato que desencadei a Tecno-Sucata ainda seja desconhecida.

item.meld-bioscrap-graft.name = Enxerto de Bio-Sucata
item.meld-bioscrap-graft.description = Usado para desfragmentar bases de Data e desbloquear novas tecnologias, e em aplicações regenerativas.
item.meld-bioscrap-graft.details = Um pedaço loucamente montado de Tecno-Sucata com Solo Terrestre e Éter empacotado..\nA primeira tentativa de farmar Resonaro. Em bora não tenha se mostrado útil em escala industrial, amostras tiveram uso em tecnologias regenerativas e geração de Data,propagando seu uso.

item.meld-abberation-core.name = Núcleo Aberração
item.meld-abberation-core.description = Usado para desfragmentar bases de Data e desbloquear novas tecnologias, e em certas fontes de Data Líquida.
item.meld-abberation-core.details = Dispensa [#9ccaed]Data Líquida[] quando energizado. Um construto bastante bruto comparado a outras fontes.

item.meld-industrial-rubble.name = Destroços Industriais
item.meld-industrial-rubble.description = Fonte de materiais lucrativos quando crackeado.\n[gray]Comestivel para o Meld.[]
item.meld-industrial-rubble.details = Grandes conjuntos podem ser encontrados ao lado de Detritos. Containers mais mantidos podem possuir partes mais refinadas.

item.meld-industrial-rubble-cracked.name = Destroço Industrial (Crackeado)
item.meld-industrial-rubble-cracked.description = Refinável para uma séria de materiais essenciais.
item.meld-industrial-rubble-cracked.details = Materiais resistentes a corrosão quando expostos a processos digestivos e dano percussivo .\nOs Strata reconhecem a maioria dos itens como Destroços Industriais crackeados. Mantenha esses itens fora de containers durante evacuação!\n...Quem é que vai--(SINAL INTERROMPIDO)

item.meld-astral-fulgurite.name = Fulgurita Astral
item.meld-astral-fulgurite.description = Refinável para uma séria de materiais vidrosos.
item.meld-astral-fulgurite.details = Se parece com a costura de um lindo cristal de Dissonitra com Resonaro, envoltado de xisto de Riploma.\n\nPor quem isso foi feito?

item.meld-grazing-bar.name = Barra Pasta
item.meld-grazing-bar.description = Uma barra altamente compactada de flora desidratada com um centro de [#b89f47]Nectar[]. Se fragmenta facilmente com um alto som ao quebrar, mas mole no interior.
item.meld-grazing-bar.details = Não tenho boca e devo PROVAR.

item.meld-meld-shard.name = Fragmento Meld
item.meld-meld-shard.description = Forma de vida vaga em formato cristalino. Uso desconhecido.
item.meld-meld-shard.details = NÃO LEVE ISSO PARA CASA.\nOq-?\nNÂO.\nMas ainda esta congelado...\nEscuta- Só coloca isso na esteira escotilha e vamos embora daqui\nQual escotilha??\nVocê sabe que "escotilha" é?\nEu- Eu não sei na verdade. Eu pensei que você sabia.\nEu uh... (mucho texto)

item.meld-larval-plating.name = Chapa Larval
item.meld-larval-plating.description = Algum tipo de pedaço juvenil de placa. Nenhum uso.
item.meld-larval-plating.details = Com o progredir da incursão, Construtos foram feitos de pedaços mais modulares. Sendo capazes de moldar pedaços de metal em cosntruções através de raios construtores foi uma grande descoberta para os [#ea9ad6]Meld[].

item.meld-larva.name = Larva
item.meld-larva.description = Connjunto metalico de segmentos que se contorcem. Comumente vistos em estruturas de incubação que manufaturam novos construtos.

item.meld-metalic-chunk.name = Conjunto Metalico
item.meld-metalic-chunk.description = Algum tipo de massa metalica. nenhum uso encontrado.\n[gray]Comestível para os Meldianos.[]
item.meld-metalic-chunk.details = Encontrado na maioria de construtos de incursões devido a tamanha disponibilidade de metais não nativos.

item.meld-metalic-globule.name = Globulo Metalico
item.meld-metalic-globule.description = Algum tipo de bolha metálica. Nenhum uso encontrado.
item.meld-metalic-globule.details = Encontrado na maioria de construtos de pré-incursão junto de Chapa Larval . Um conglomerado de metais nativos de Ikaru.

item.meld-stony-particulate.name = Particulas Pétreas
item.meld-stony-particulate.description = grãos de pedra de carbono.
item.meld-stony-particulate.details = Grudado e colado através do [#ea9ad6]Meld[] usando algum tipo de processo desconhecido.

item.meld-bramble-vine.name = Vinha Espinhenta
item.meld-bramble-vine.description = Fios biológicos e grossos pulsando com [#89828c]Mercúrio[].\nPossui amostras de [#89413e]Gosma[]

item.meld-compacted-masses.name = Massa Compactada
item.meld-compacted-masses.description = Conjunto de material biológico envoltado de [accent]Vinhas Espinhentas[].

item.meld-starving-masses.name = Massa Faminta
item.meld-starving-masses.description = Conjunto de material biológico murchado. Funciona como um bom meio de filtração. A textura é bem seca.
item.meld-starving-masses.details = Ei, para de comer isso, não sabemos do que é fei--\nCala a boca, estou preso aqui a eras\nNão significa que você deveria comer isso, provavelmente esta esfomeado\nEsfomeado de que? A gosma que continuam me oferencedo para beber?\n...Você quer provar?

item.meld-elderflesh.name = Carne-Anciã
item.meld-elderflesh.description = Fios biológicos torcidos pulsando com [#b89f47]Nectar[].\nConstitui a flora dos Pântanos de Mercúrio.

item.meld-blossoming-elderflesh.name = Carne-Anciã Florescente
item.meld-blossoming-elderflesh.description = Bolas de pó de finos grãos biológicos e fendas entrelaçadas com filamentos maiores..\n[gray]Comestivel para os Meldianos.[]

item.meld-coagulated-vigor.name = Vigor Coagulado
item.meld-coagulated-vigor.description = Um pedaço de carne de daemon que queimam sem parar, constantemente em um estado cancêroso. Alguém deve imaginar Icarus Feliz.\n[gray]Comestivel para os Meldianos.[]

item.meld-homunculus-chunk.name = Conjunto de Humúnculo
item.meld-homunculus-chunk.description = Conjuntos de... alguma coisa?\nNão completamente humano.\n[gray]Comestivel para os Meldianos.[]

//Liquids

liquid.meld-aether.name = [#cb8650]Éter
liquid.meld-aether.description = Coletado passivamente por certas estruturas. Encontrado em ambundância em [accent]fontes de éter[].
liquid.meld-aether.details = Contém uma abundância de aspectos primordiais.

liquid.meld-aspect.name = [#cbdbfc]Aspectro
liquid.meld-aspect.description = Alternativa instável para fontes de energia. Refinável.
liquid.meld-aspect.details = Aspectos primordiais misturados.

liquid.meld-nectar.name = [#b89f47]Nectar
liquid.meld-nectar.description = Usado como um resfriador potente. Pode se refinado em [#89828c]Mercúrio[] com temperaturas altas e reagentes corretos. Encoraja um leve efeito de regeneração em unidades.
liquid.meld-nectar.details = Blood of the swamp.

liquid.meld-mercury.name = [#89828c]Mercúrio
liquid.meld-mercury.description = Usado como lubrificante. Funciona como uma tóxina potente em craturas de origem [#ea9ad6]Meldianas[].
liquid.meld-mercury.details = O banco de dados fica um pouco... Duvidoso com a auto-análise do material. Lembrar de clarificar o que estatísticas como "capacidade térmica" e "temperatura" significam com qualquer sobrevivente.

liquid.meld-blood.name = [#7d312f]Sangue
liquid.meld-blood.description = [gray]...\nOque?[]
liquid.meld-blood.details = Força vital do Pântano.\n\n[accent]Ciclo[]

liquid.meld-ooze.name = [#89413e]Gosma
liquid.meld-ooze.description = Nenhum uso aparente. Frio ao toque.
liquid.meld-ooze.details = Compromete a maioria do terreno em Pântanos de Mercúrio. Bastante denso, ainda assim bem fluido.\n\n[accent]Decadência[]

liquid.meld-rift.name = [#8872da]Fenda
liquid.meld-rift.description = Pode ser refinado em [#b460e2]Dobra[]. Liberado por [#cb8650]Éter[] fundido com Carbolito sobre altas temperaturas.
liquid.meld-rift.details = Aspectos primordiais embaralhados.

liquid.meld-warp.name = [#b460e2]Dobra
liquid.meld-warp.description = Utilizado em construções de utilidades como combustível e em construções de maiores tiers de unidades.\n\n[scarlet]Altamente Instável[]

liquid.meld-ichor.name = [#e6c700]Ícor
liquid.meld-ichor.description = Fonte comum de alimento para os [#ea9ad6]Meld[]. Serve de combustível para o nascimento de construtos [#ea9ad6]Meld[] e um componente necessário em sistemas de energia sustentáveis/infraestruturas de alta-produção.

liquid.meld-liquid-data.name = [#9ccaed]Data Líquida[]
liquid.meld-liquid-data.description = Formato líquido de Data puxado de Tecno-Sucata e outros materiais selecionados.
liquid.meld-liquid-data.details = Aparenta funcionar como uma fonte de energia alternativa.

liquid.meld-null.name = [red]Nulo
liquid.meld-null.description = Subproduto do crackeamento de Tecno-Sucata. Comumente desaparece sem deixar rastros.

liquid.meld-meld.name = [#ea9ad6]Meld[]
liquid.meld-meld.description = Aos poucos dissolve a maioria dos metais e componenete orgânicos, com exceções.
liquid.meld-meld.details = A forma de vida original de Ikaru em estado gasoso.

liquid.meld-waste.name = Lixo
liquid.meld-waste.description = Slurry de materiais inúteis.

liquid.meld-cold-waste.name = Lixo Frio
liquid.meld-cold-waste.description = Slurry frios de materiais inúteis

liquid.meld-valid.name = Posicionamento Válido
liquid.meld-deposit.name = Depósito
liquid.meld-progress.name = Progesso
liquid.meld-charge = Carga
liquid.meld-dissonance = Carga


//Units

//Internal

unit.meld-observer.name = Obsservador
unit.meld-observer.description = Comandante do Núcleo "Jangada (dormente)". Projeta um grande campo de construção e  aplica [accent]Reunir[] em aliados próximos. Não consegue minerar, e possui velocidade de construção lenta.
unit.meld-observer.

//Strata units

unit.meld-bulbhead.name = Bulbo
unit.meld-bulbhead.description = Comandante do Núcleo "Jangada". Dispara pulsos sonares e aplica [accent]Reunir[] em aliados próximos. Repara estruturas aliadas. Se reconstitui com líquidos proprios ou com o tempo.
unit.meld-bulbhead.details = O clássico.

unit.meld-bulbhead-sonar.name = Bulbo Observador

unit.meld-omega.name = Omega
unit.meld-omega.description = Comandante do Pad "Omega". Lança Canisters de estilhaços e aplica [accent]Reunir[] em aliados próximos.\n\nTem um gerador de escudo pessoal que alimenta um campo de força que se cura mais rápido quanto menor a integridade do escudo. Consegue se reconstituir com líquidos apropiados.
unit.meld-omega.details = The other classic.

unit.meld-psi.name = Psi
unit.meld-psi.description = Comandante do Pad "Psi". Carrega e dispara turbilhões de [#cbdbfc]Aspectro[], causando dano [red]devastador[], e aplica [accent]Reunir[] em aliados próximos.\n\nTem um gerador de escudo pessoal que alimenta um campo de força que se cura mais rápido quanto menor a integridade do escudo. Consegue se reconstituir com líquidos apropiados.
unit.meld-psi.details = ...tem certeza que isso vai funcionar?\n\nEu ja testei antes, o quão ruim isso poderia acabar?

unit.meld-phi.name = Phi
unit.meld-phi.description = Comandante do Pad "Phi". Lançam espinhas que penetram armadura e liberam espuma gosmenta ao atingir o chão, e aplica [accent]Reunir[] em aliados.\n\nPode se reconstituir com líquidos apropiados ou tempo.\n\n[accent]Levemente Armadurado[]
unit.meld-phi.details = ...Não é tão agressivo...?\n\nNão precisa ser, nos compra tempo e suporte para outros comandantes.

unit.meld-outcast.name = Proscrito
unit.meld-outcast.description = Comandante velho do Núcleo "Bunker". Solta minas giratórias que sugam vida de alvos atingidos.
unit.meld-outcast.details = Não é um clássico. Ainda assim uma bela unidade.

unit.meld-iguana.name = Iguana
unit.meld-iguana.description = Comandante do Núcleo "Bunker". Lança vórtices de sucção que explodem após um delay. [accent]Reune[] aliados próximos. Movimentação terrestre omnidirecional rápida.\n\n[accent]levemente armadurado[]
unit.meld-iguana.details = Um alienígena deveras interessante.

unit.meld-shark.name = Tubarão
unit.meld-shark.description = Lançam misseis que roubam vida do alvo. Consegue flutuar sobre piscinas de líquidos. E um [accent]excelente[] escoteiro.\n[red]Fraco contra campos de força.[]
unit.meld-shark.details = Trabalha em conjunto com os outros peixes mecânizados, especialmente Remoras e Narvais.

unit.meld-narwhal.name = Narval
unit.meld-narwhal.description = Lança ataques órbitais de curto alcance. Consegue flutuar sobre piscinas de líquidos. Carrega um campo de energia canalizado em seu espinho quando se move rapidamente que empurram unidades para longe.\n\n[gray]Ah, se tivesse uma forma de lança-los como misseis...[]\n\n[accent]Levemente Armadurado[]


unit.meld-reef.name = Coral
unit.meld-reef.description = Minera Depósitos. Aos poucos regenera vida.

unit.meld-bloodied-reef.name = Coral Ensanguentado
unit.meld-bloodied-reef.description = ... Isto Sangra?

unit.meld-forlorn-reef.name = Coral Abandonado
unit.meld-forlorn-reef.description = Como é que ainda funciona...?

unit.meld-shambling-reef.name = Coral Cambaleante
unit.meld-shambling-reef.description = ... Da até pena de ver-

unit.meld-astrea.name = Astrea
unit.meld-astrea.description = Lança espinhas que penetram armadura em alvos. Caminha sobre obstruções sem impecilho.
unit.meld-astrea.details = Adora Barreiras Carbônicas. Você que decide o que fazer com essas unidades.

unit.meld-remora.name = Remora
unit.meld-remora.description = Lança misseis teleguiados que sugam vida do alvo, puxando alvos para mais longe após viajar uma certa distância.
unit.meld-remora.details = Em bora seja uma relação abiotica, Remoras ajudam Tubarões a tankar dano no campo de batalha enquanto os Tubarões provem informação de onde os inimigos estão. Uma relação simbiotica para os dois peixes mecânizados.

unit.meld-hammerhead.name = Cabeça-de-Martelo [red](PS)[]
unit.meld-hammerhead.description = Lança fragmentos penetrantes em alvos, fazendo-os receber mais empurrão de outras fontes. Aos poucos se regenera de combate.\n\nPode ser afetado pela maioria de efeitos benéficos.\n\n[purple]Biológico![]\n\n[red]SPRITES PLACEHOLDER![]

unit.meld-dragonfly.name = Libélula
unit.meld-dragonfly.description = Carrega uma lançador de espinhos enquanto voa.
unit.meld-dragonfly.

//Fringe units

unit.meld-enforcer.name = Executor
unit.meld-enforcer.description = Comandante de esquadrõs durante incursões. Lança um spray de balas contra alvos e misseis com alto empurrão. Consegue se reconstituir com líquidos apropiados.
unit.meld-enforcer.details = Unidade de comando geral usado junto com especialistar durante a incursão.

unit.meld-impaler.name = Impalador
unit.meld-impaler.description = Penetra alvos com explosões de estilhaços a curto alcance. Constroi e planta auto-torretas de seu Toras.\n\n[accent]armadurado[]
unit.meld-impaler.details = Criado durante a incursão para ajudar contra construtos armadurados. Não é um bom combatente contra alvos largos.

unit.meld-impaler-autoturret.name = Auto-torreta do Impalador

unit.meld-time-keeper.name = Mantedor Temporal
unit.meld-time-keeper.description = Lacera alvos com um spray de Resonaro Particulado. Aos poucos regenera vida com o tempo. \n\n[accent]Levemente Armadurado[]
unit.meld-time-keeper.details = Uma pesada opção para controle de grupo. Um experimento de ralar Resonaro que funcionou.

unit.meld-purifier.name = Purificador
unit.meld-purifier.description = Perfura estruturas e unidades inimigas. Se reconstitui com líquidos apropriados.
unit.meld-purifier.details = Um modelo que pre-data a incursão, Construido com materiais locais.


//Meld units

unit.meld-jilla.name = Jilla
unit.meld-jilla.description = [#ea9ad6]Primeira forma dos besouros/minhocas de crystal[]\nSeu cristal estabilizado lhe permite cuspir fogo indefinidamente sem repercussão.
unit.meld-jilla.details = Estranhamente, os Jilla não formam pernas em sua maturidade, mais similar a uma minhoca do que um besouro de cristal. Pensaram que os Jillas eram a primeira etapa para formação de novos besouros de cristais, mas explorações mais profundas em cavernas resultou na desoberta de algo inesperado...

unit.meld-scorcher.name = Abrasador
unit.meld-scorcher.description = [#ea9ad6]Pequeno besouro de cristal que forma enxames[]\nFoi observado que o construto recebe dano constante ao disparar seu fogo.
unit.meld-scorcher.details = Os abrasadores são provavelmente os besouros de cristais originais. Jillas são rapidos e geralmente agressivos, enquanto os abrasadores são observados circundando suas casas, por serem frageis demais para explorar.

unit.meld-gilla.name = Gilla
unit.meld-gilla.description = [#ea9ad6]Segunda forma de besouros de cristal[]\nSeu formato mais parrudo permite que o construto sobreviva mais tempo enquanto cospe fogo.

unit.meld-killa-armored.name = Killa (Armadurado)
unit.meld-killa-armored.description = [#ea9ad6]Segunda forma de besouros de cristal[]\nFoi observado lançarem globulos contra alvos hostis, sendo catapultado para longe do alvo. \n\n[red]Levemente Armadurado[]
unit.meld-killa-armored.details = Mais lentos graças a suas cascas, Os Killa são os únicos construtos armadurados conhecidos por usarem Resonaro.

unit.meld-killa.name = Killa
unit.meld-killa.description = [#ea9ad6]Segunda forma de besouros de cristais[]\nPropulsores permitem movimentação rápida e resistência contra o vento.
unit.meld-killa.details = Estes pequenos patetas aparentam terem desenvolvido uma tolerância contra Resonaro através de consumo e embebedamento do material durante suas vidas inteiras, e estão preparados para usarem seu vício insaciável para passarem de sua defesa.

unit.meld-craig.name = Craig
unit.meld-craig.description = [#ea9ad6]Primeria forma dos "pilha de sucata"[]\nBaixa durabilidade com arma instável, mas comumente chegam em exames.
unit.meld-craig.details = Composto de materias comumente encontrados em [#e6c700]Ícor[].

unit.meld-afraig.name = Afraig
unit.meld-afraig.description = [#ea9ad6]Primeira forma "berzerk" dos "pilha de sucata"[]\nQuando esta lançando chamas, o construto se lança na direção de disparo. Cuidado com Afraigs [#ea9ad6]Amplificados[].\n\n[red]Armadurado[]

unit.meld-braig.name = Braig
unit.meld-braig.description = [#ea9ad6]Segunda forma de artilharia dos "pilha de sucata"[]\nO construto mantém distância enquanto dispara, aramado também com disparadores de Craigs.\n\nFunciona como um iniciador de lutas de cerco, capaz de tomar cobertura em [#ea9ad6]Capsulas Meld & Beacons[].

unit.meld-poisag.name = Poisag
unit.meld-poisag.description = [#ea9ad6]Segunda forma de blindagem dos "pilha de sucata"[]\nFoi observado lançando [#ea9ad6]Capsulas Meld[] em miniatura, lançando ao atingir ou perto de unidades.\n\nPerigoso quando combinado com costrutos que podem usar a cobertura eficientemente, ou quando a munição é limitada.\n\n[red]Levemente Armadurado[]

unit.meld-pointago.name = Pointago
unit.meld-pointago.description = [#ea9ad6]Segunda forma dos "pilha de sucata" após incubação[]\nOs construtos manteem distância quando disparando, mas vai comumente correr contra alvos hostis.\n\nObservado carregar um incubador que pode forma cristais, do qual a criatura consome para um pulso de energia.

unit.meld-graig.name = Graig
unit.meld-graig.description = [#ea9ad6]Ninho megálito dos "pilha de sucata"?[]\nFoi observado dar vida a Craigs em massa. Armadurado com múltiplas armas de Braigs e Craigs, o construto consegue defender a si mesmo bem.\n\nTeorizado ser o fragmento de um "pilha de sucata" mais largo.\n\n[red]Pesadamente Armadurado[]

unit.meld-wuba.name = Wuba
unit.meld-wuba.description = [#ea9ad6]Primeira forma da minhoca kamikaze[]\nQuando ameaçado ou necessita defender seu ninho, o construto se lança de sua casca e tenta detonar.

unit.meld-wuba-exploding.name = Wuba [red](Explodindo!)[]
unit.meld-wuba-exploding.description = Um largo, blob volátil, vai detonar logo.\n\n[#ea9ad6]Blob![]
unit.meld-wuba-exploding.details = Essa coisa pensa???

unit.meld-uwubba.name = Uwubba
unit.meld-uwubba.description = [#ea9ad6]Primeira forma da minhoca kamikaze[]\nUm Wuba envoltado de uma casca pétra, não tão differente de um Killa Armadurado.\n\n[red]Pesadamente Armadurado![]
unit.meld-uwubba.details = ... Deve ter algum tipo de piada a ser feita aqui.

unit.meld-ontragga.name = Ontragga
unit.meld-ontragga.description = [#ea9ad6]Segunda forma das minhocas de Cerco[]\nO construto rasteja pela frente protejendo numerosos Wuba em seu interior de males enquanto carrega um canhão de Éter pesado que dispara trés rajadas.\n\nEste construto é um alvo de [accent]alta prioridade[] e [red]deve[] ser eliminado antes que penetre um perímetro defensivo, [red]NÃO DEIXE ISTO PASSAR.[]\n\n[red]armadurado![]\n\n[orange]Biomecânico![]
unit.meld-uwubba.details = Yknow theres probably a joke to be made here.

unit.meld-globkin.name = Globkídeo
unit.meld-globkin.description = [#ea9ad6]Construto ninho guardião e escaramuçador[]\n\nO conjunto é lançad para trás após lançar uma explosão de estilhaços de seus canhões, contendo múltiplas bolhas que detonam se não exterminadas rapidamente.\n\nDistraia com unidades moveis ou coloque Ping de Observador no construto para prevenir que ele seja empurrado além de suas defesas.\n\n[red]Armadurado![]

unit.meld-allegro.name = Allegro
unit.meld-allegro.description = [#ea9ad6]Construto ninho guardião Falange[]\nO construto possui um orgão projetor de tempestade que explode em uma rajada de Meld em forma de vapor periodicamente.\n\nReconstitui construtos em seu alcance e dissolve unidades inimigas com seus lança chamas, se lançando para trás para se manter na frente de um perímetro defensivo.\n\n[red]ALVO PRIORIDADE, DESTRUIR AO AVISTAR.\nNÃO INICÍE COMBATE DE CURTO ALCANCE.\nVOCÊ FOI AVISADO[]

unit.meld-impovrished.name = Empobrecivado
unit.meld-impovrished.description = [#ea9ad6]Construto ninho guarião bateria[]\nO construto é um amalgama formado por "pilhas de sucata" comuns.\n\nComumente se esconde atrás de unidades de artilharia enquanto usa seus canhões/rifles para prover suporte de combate.\n\Espalha [#ea9ad6]Capsulas Meld[] miniaturizadas de sua ponta.\n\n[red]O construto é uma fonte perigosa de atrofia, Flankei-o e DESTRUA ao ser indentificado.[]\n\n[red]Armadurado!\n\n[orange]Biomecânico![]
unit.meld-impovrished.details = Uma piada de uma piada-\nUm efígio de um fraude, mas bastante perigoso.

unit.meld-tracker.name = Persguidor
unit.meld-tracker.description = [#ea9ad6]Primeira forma de artilharia de suporte dos "pilhas de sucata"[]\n\nO construto aparenta ser um incubador móvel, cujo único propósito é formar projeteis e guia-los para o alvo.

unit.meld-tracker-projectile.name = Projétil de Perseguido
unit.meld-tracker-projectile.description = [#ea9ad6]Construto Projétil[]\nManufaturado dentro de um [accent]Perseguidor[] e é direcionado em direção a seu alvo através de algum mecânismo guia desconhecido.

unit.meld-fletch.name = Fletch
unit.meld-fletch.description = [#ea9ad6]Primeira forma mímico, flutuante[]\nEste construto aparenta mimicar um [accent]Tubarão[]? Não tenho certeza do que deve ser além disso...
unit.meld-fletch.details = Nossos testes com "propulsores" parece ter funcionado. O Lança-Blobs na carcaça de metal se prova efetivo contra construtos inimigos, e Mercúrio não será um problema com sua movimentação manuseada assíncrona a base de cristais.

unit.meld-kathid.name = Katídio
unit.meld-kathid.description = [#ea9ad6]Primeira forma dos "besouros de cristal", de ninho[]\nTeorias sobre como os [#ea9ad6]Meldianos[] formam colônias ja circulam a um bom tempo desde sua descoberta.\n\nUma teoria é que construtos armadurados como Katídios usam suas chamas para penetrar pedras, da mesma forma que fazem com metal. Isso não levaria as formações gigantes de pedra avistadas ao redor.\n\n[red]Armadurado[]

unit.meld-katika.name = Katika
unit.meld-katika.description = [#ea9ad6]Primeira forma dos "besouros de cristal", hidra[]\nO construto aparenta ser um Katídio sem sua casca grossa e com múltiplas cabeças, em bora haja poucas evidências para isso.\n\nTalvez um erro em sua criação propagado por sua utilidade?\n\nIndependente de sua aparência, o blob controlando o construto age como entidade própria.
unit.meld-katika.details = Dá para se fazer alguma piada sobre evolução aqui.

unit.meld-kithlid.name = Kiflídio
unit.meld-kithlid.description = [#ea9ad6]"besouro de cristal", ninho megálito[]\nFoi observado o construto produzir constantemente unidades [#ea9ad6]Jilla[] em formatos de misseis quando atacando ameaças.\n\nEmbora [#ea9ad6]Kiflídios[] comumente se movimentam rápido para atacar alvos, sua habilidade de fazer isso é diminuida quando carrega sua enchurrada de chamas.\n\nCertifique-se que todas as partes de um Kiflídio é corretamente eliminada após destruir a casca do construto.\n\n[red]Pesadamente Armadurado[]

unit.meld-pester.name = Pestadeira
unit.meld-pester.description = [#ea9ad6]Voador pequenos irritante[]\nDispara contra alvos com rajadas de chamas. Requer tempo para recarregar.\nDanifica unidades e estruturas abaixo de si.

unit.meld-spillway.name = Vertedor
unit.meld-spillway.description = [#ea9ad6]Primeira forma de construtos que transportam cargas[]\nJá nascido em sua última forma ao invés de se constituido de múltiplas formas, mas explode em [#ea9ad6]Craigs[] e [#ea9ad6]Wubbas.[].\n\nLeia [accent]<Núcleo de Vertedor>[] para mais informações sobre esse construto.

unit.meld-spillway-projectile.name = Núcleo de Vertedor
unit.meld-spillway-projectile.description = [#ea9ad6]Construto Projétil[]\nEm bora o núcleo pareça discreto, é possível ver duas indentações, olhos.\n\nNão se sabe se é o núcleo ou Vertedor que controlam a unidade, mas ambos explodem em múltiplos construtos quando destruído.

unit.meld-gala.name = Gala
unit.meld-gala.description = [#ea9ad6]Pequeno transportador de Blobs[]\nCarrega Blobs para onde são necessários. As vezes vai sacrificar a si mesmo, caindo em estruturas inimígas para liberar seus Blobs.

unit.meld-blob.name = Blob
unit.meld-blob.description = [#ea9ad6]Blob![]\nUma bolha essencialmente. O que mais há a se dizer?\n\nBlob blob blob blob blob.\n\n[#ea9ad6]Blob![]\n\nExplode após um delay, causando dano massivo.\n[gray]Não se lembra do que aconteceu quando chegamos perto de um desses-[][red]<FIM DE GRAVAÇÃO>[]
unit.meld-blob.details = Você não me deixou falar!\nDo mesmo jeito que aquele Blob cortou nossa energia, sim sim eu sei o que aconteceu na última vez...\nVocê esqueceu de mencionar que esses blobs são econtrados em estruturas estranhas, de onde é que essa coisa vem?\nIsso terá de esperar por uma futura pesquisa.

unit.meld-splurger.name = Esplurgário
unit.meld-splurger.description = [#ea9ad6]Um Blob pequeno e armadurado[]\nEles deram armadura para blobs, porque armadurar um blob?\n\nSe isso é um tipo de piada igual da última vez eu juro que-[red]<FIM DE GRAVAÇÃO>[]\n\n [red]armadurado![]
unit.meld-splurger.details = ... Bolas de aço... Em poucas palavras, são bolas, armaduradas... (suspiro alto) Odeio meu empre- <FIM DE GRAVAÇÃO>

unit.meld-zip.name = Zip
unit.meld-zip.description = [#ea9ad6]Missel leve invocador[]\nAvistado em enxames que voam entre colônias. Cuidado com os [#ea9ad6]Jilla[] que carregam.

unit.meld-inator.name = Inador
unit.meld-inator.description = [#ea9ad6]O primeiro fulgariano escaramuçador[]\nPrimeiro construto observado não ter nenhuma protusão causada por [#ea9ad6]Meld[]. Eu não tenho certeza de como operam...\n\n[orange]Completamente mecânico![]
unit.meld-inator.details = A verdadeira primeira unidade mecânica adicionada ao mod. Houve uma tentativa com unidades voadoras, mas nunca passaram da fase de teste.

unit.meld-stoner.name = Petroso
unit.meld-stoner.description = [#ea9ad6]Fulgariano parrudo de artilharia incendiária[]\n\nO construto precisa se posicionar antes de armar seu equipamento. Não consigo decidir que é impressionante que funciona ou se é preocupante o fato de que possui um pedaço imenso de dissonitra Colada a seu corpo.\n\n[orange]Completamente mecânico![]
unit.meld-stoner.details = Provavelmente fuma muito crack.

unit.meld-bulwark.name = Baluarte
unit.meld-bulwark.description = [#ea9ad6]Primeira forma de um fulgariano defensor[]\nO construto possui uma capsula coberta por uma camada de metal. Me pergunto se precisa de abastecimento...\n\n[red]Levemente Armadurado[] e [orange] Mecânico!
unit.meld-bulwark.details = An absolute mance to fight. Be prepared...

unit.meld-soontm.name = Vindo logo logo!

//research categories

//Liquid logistics tree

status.meld-liquid-logistics.name = [accent]Logísticas de Líquido[]
status.meld-liquid-logistics.description = Esquemas básicos para [accent]network de distribuição de líquidos[] e uma fonte de [#cb8650]Éter[].\nComposto de quatro componentes.\n\n\n-[accent]Nodos de Encanamento[] que formam os cantos e saidas do network\n-[accent]Faces de Encanamento[] que conectam partes do network.\n-[accent]Canal Direcionador[] que controla a pressão e direção dos fluídos\n-[accent]Tomadas de Aspectro[] que serve como pontos finais do network de [#cb8650]Éter[].\n\nEncanamentos são estaveis o suficientes para serem posicionados em piscinas funda de líquido. O pano de fundo [red]não[] suporta encanamentos.

status.meld-murk-handling.name = [accent]Manuseio de Escuridão[]
status.meld-murk-handling.description = O Pântano de Mercúrio provou ser bastante hostil em diversas maneiras, mas além das ameaças hostis, tivemos múltiplos problemas em relação a Massa faminta em Excesso e manuseio de fluídos...\n\nEstes esquemas detalham um número de maneiras de manusear isso, indo de [accent]Nodos Compartimentalizados[], [accent]Unidades de Filtração[], [accent]Câmaras de Purificação/Neutralização[].\n\n[accent]Dispersão Pressurizada[] seria muito útil para controlar acidentes.

status.meld-pressure-control.name = [accent]Controle de Pressão[]
status.meld-pressure-control.description = Meios avançados de [accent]Controle de Pressão[] envolvendo [accent]Hubs de líquidos Largos, Direcionadores Pressurizados, e sifão de fluídos[].

status.meld-pressurized-dispersion.name = [accent]Dispersão Pressurizada[]
status.meld-pressurized-dispersion.description = Levar fluídos de um ponto A para B era previamente possível apenas com canais de encanamento. Qualquer maneira de liberar fluídos no mundo apenas cria poças.\n\nCom avanços em [accent]Controle de Pressão[] combinado com observações da flora de Pântanos de Mercúrio, fluídos podem ser dispersados agora com mais controle sobre longas distâncias.\n\n[red]Maiores avanços em tecnólogia são necessários para que pontes ultrapassem espaçamentos dentro do network de Encanamentos ou para utilizar jatos sólidos atomizados.[]\n\n[accent]Manuseio de Escuridão[] é bastante útil para filtrar fluídos para serem usados em sprayers.

status.meld-fluid-extraction.name = [accent]Extração de Fluídos[]
status.meld-fluid-extraction.description = Métodos de filtração inspirados a partir de Carne-Anciã Florescente que formam um caminho para a obtenção [accent]direta[] de fluídos de [accent]depósitos da superfície[] com diversos métodos experimentais.
status.meld-fluid-extraction.details = Finalmente, uma maneira de extrair [#89828c]Mercúrio[] direto de piscinas. E uma maneira de extrair largas quantidades de [#ea9ad6]Meld[] líquido se eu quiser.

status.meld-crude-crackers.name = [accent]Crackeadores Brutos[]
status.meld-crude-crackers.description = Esquemas que tomam vantagem das propriedades catalíticas das Terras Áridas.\n\n[#8166f0]Mais observação pode ser necessária para desfrgmentar completamente as construções deste banco de dados.[]
status.meld-crude-crackers.details = A implicação de precisar usar tecnologias tão primitivas para adquirir [#cb8650]Éter[] não podem ser ignoradas.

liquid-logistics.unlock = [accent]Logística de Líquidos Desbloqueada![]\n[gray]<Dê uma olhada na \uE875 Árvore de Tecnologias>

//Item logistics tree

status.meld-item-logistics.name = [accent]Logísticas de Itens[]
status.meld-item-logistics.description = Esquemas básicos para um [accent]sistema de distribuição[] e uma fonte de [accent]Item[].\n\nEsse sistema possui um sistema de [accent]Escotilhas Esteiras[] que roteiam itens de lugar a lugar.

item-logistics.unlock = [accent]Logísticas de Itens Desbloqueada![]\n[gray]<Dê uma olhada na \uE875 Árvore de pesquisa>

status.meld-storage-hubs.name = [accent]Hubs de Armazém[]
status.meld-storage-hubs.description = Detalhes sobre [accent]Buffers[] e [accent]Descarregadores[], considerado perdido no tempo.\n\nPlanos para armazéns massivo ainda estão [red]encriptados[] por enquanto...

status.meld-fissure-tapping.name = [accent]Extração de Fissuras[]
status.meld-fissure-tapping.description = Esquemas para construções que conseguem tirar uso das diversas aberturas presentes em Ikary como [accent]Aberturas[], [accent]Fissuras[] e [accent]Crescimentos[].\n\n[#8166f0]Mais observações são necessárias para desfragmentar completamente as construções deste banco de dados.[]
status.meld-fissure-tapping.details = As aberturas Ikaruanas possuem propriedades estranhas. A maioria das aberturas emitem fumos que são importantes em um número de diferentes processos, mas os principais dois processos é a criação de um susbtituto de concreto e a sintetização de Carbolito em momentos de Deficit.\n\nAlgumas aberturas estão ricas em [#e6c700]Ícor[], emitindo brilhos coloridos junto de fumaça emaranhada marrom comum.

fissure-tapping.unlock = [accent]Extração de Fissuras Desbloqueada![]\b[gray]<Dê uma olhada na \uE875 Árvore de Pesquisa>

status.meld-building-foundations.name = Fundações de Construção
status.meld-building-foundations.description = Por muito tempo estruturas usam Detritos e Carbolito como fundação, usando materiais refinados apenas para mover partes...\n\nCom nova Data sobre as propriedades do [#e6c700]Ícor[], e observações sobre como construtos [#ea9ad6]Meldianos[] formam suas cascas, uma nova maneira de industrialmente cementar pó de Carbolito em uma imitação de Pedras de Carbono foi prototipada e esta pronto para uso.\n\n[accent]Conglomeradores de Tijolos e and Moedores Terrestres[] produzem os tijolos e argamassa para fundações de construções com uma variedade de materiais e depósitos, permitindo que certas construções possuam um pouco de [accent]armadura[] natural e serem construidos bem mais rápido.\n\n[accent]Rochedos são uma boa fonte de Tijolos/Gosma Pétrea e irá devolver um pouco quando desconstruido.[]

status.meld-mercurial-extraction.name = [accent]Extração Mercurial[]
status.meld-mercurial-extraction.description = Um grupo de esquemas, todos baseados em um único objetivo: Refinar material cru em mercúrio sobre fontes geotermais.\n\nInteressantemente, possui uma exceção. O [accent]Amalgamador de Electrum[].
mercurial-extraction.unlock = [accent]Mercurial Extração Mercurial Desbloqueada![]\n[gray]<Dê uma olhada na \uE875 Árvore de Pesquisa>



//Utility tree

status.meld-aspect-channeling.name = [#cbdbfc]Encanamento de Aspectro[]
status.meld-aspect-channeling.description = Detalhes sobre como conter e canalizar Aspectro em uma variedade de usos como [accent]Pulsos Sonar[], [accent]Auto-Regeneração[] e até [red]NULIFICAÇÃO[].\n\nContém alguns esquemas para construções que usam prata e Resonaro, mas o resto esta espalhado entre outros Bancos de Data...
status.meld-aspect-channeling.details = Aspectro foi considerado perigoso demais para ser convertido em energia em grandes escalas, mas há um rumor de um Banco de Data pesadamente Encriptado que permitia esse tipo de conversão.\n\nO templo que guarda esse segredo foi escondido dos Strata , escondido de você, mas ainda há esperança de que não tenha sido completamente afundado neste planeta...

aspect-channeling.unlock = [accent][#cbdbfc]Encanamento de Aspectro[] Desbloqueado![]\n[gray]<Dê uma olhada na \uE875 Árvore de Pesquisa>

status.meld-power-transmission.name = [accent]Transmissão de Energia[]
status.meld-power-transmission.description = Esquemas para construções que usam electrumpara focar energia em raios, permitindo transmissão sem acoplamento físico. Este banco de dados possui três construções.\n\n-[accent]Conectores[] são nodos de energia (padrão de estoque) que usam Gosma Pétrea a Tijolos Compactados ao invés de materiais mais abundantes, permitindo que estes sejam construidos bem rápido.\n-[accent]Substações[] são capazes do conectar através de longas distâncias (mas para poucos alvos) e armazenam uma pequena quantidade de energia.\n-[accent]Links Continentais[] são capazes de cruzar largas seçoes de um setor em uma direção cardinal, e podem sustentar bastante dano.\n\n[#8166f0]Mais estudos podem ser necessários para desfragmentar completamente as construções deste Banco de Dados.[]

//sector categories

//Todo: Unify Unlocked text?

status.meld-ruins.name = Ruinas
status.meld-ruins.description = Este ponto de informação marca o último local conhecido de intância dos Strata, e parece enraizar em uma quantidade quase infinita de grupos de setores.\n\n[accent]Como a campanha ainda é um  WIP por enquanto, nenhum grupo de setor é ascessivel ainda![]
status.meld-ruins.details = Esta na hora...

ruins.unlocked = [accent]"Ruinas" Desbloqueada![]\n[gray]<Dê uma olhada na \uE875 Árvore de Pesquisa>


status.meld-lonely-creek.name = Lonely Creek
status.meld-lonely-creek.description = This data point leads toward a secluded creek woven between monolithic rock formations.\n\n[red]There are hundreds, maybe thousands of heat signatures in the distance, none of which are recognisable through the fog.[]\n\nWhat is this place?
status.meld-lonely-creek.details = [lightgray]This is not the way out you were looking for, and you don't have much else to go off.\n\nTime to get yourself together and explore your suroundings.[]

beginnings.unlocked = [accent]Lonely Creek Unlocked![]\n[gray]<Check the \uE875 Techtree>


status.meld-barrens.name = Carbonic Barrens
status.meld-barrens.description = This data point appears to mark the entrance to a large expanse of carbon stone.\n\nThere is a heavy pink fog in the area lowering visibility dramatically, though there appears to be plentiful [accent]carbolith[] deposits scattered throughout.
status.meld-barrens.details = [lightgray]It's too clouded to recognize anything from a distance.[]\n\nMythical daemons were rumored to inhabit the lands of unseen planets. Though I've never seen one, I'd assume this place may have some answers.
barrens.unlocked = [accent]Carbonic Barrens Unlocked![]\n[gray]<Check the \uE875 Techtree>

status.meld-glacier.name = Glacier's Edge
status.meld-glacier.description = This data point leads to a giant formation of crystalline megaliths.\n\n[accent]The fog isn't as thick here, allowing full vission of the terrain.[]\n\nConversely, there seem to be [red]trace amounts of resources available[], though many [accent]friendly[] signals pop up within the datapoint's bounds.
status.meld-glacier.details = They're trapped. As soon as it assumed there were no hostiles around, the spikes grew. Nobody's ever seen this before, and I pray that nobody suffers the same fate.
glacier.unlocked = [accent]Glacier's Edge Unlocked![]\n[gray]<Check the \uE875 Techtree>

//Status effects

status.meld-aspect-burn.name = Queimadura Aspectral
status.meld-aspect-burn.description = Dobra o o dano recebido, e um pouco de DoT. Aplicadas por armas baseadas em [#cbdbfc]Aspectro[] em conjunção com queimadura. \nSó afeta alvos mecânicos ou Armadurados.
status.meld-aspect-burn

status.meld-blackout.name = Blackout
status.meld-blackout.description = Desapareça. Aplicada pelo [gray]Pano de Fundo[]
status.meld-blackout.details = Sendo remodelado pelo lúcido, tamanha tristeza para aquele adormecido.

status.meld-dissolving.name = Dissolvendo
status.meld-dissolving.description = Pequeno DoT e dobra dano recebido. Aplicado por [#ea9ad6]Beacons de Meld[].
status.meld-dissolving.details = Sendo ralado pedaço por pedaço pelo [#ea9ad6]Meld[], de pouco a pouco.

status.meld-strata.name = Strata
status.meld-strata.description = Utiliza os recursos básicos de Ikaru para algo maior.\n[accent]É você![]
status.meld-strata.details = Nosso último recurso. Se o sonhador há de se perder, uma intância de você vai acordar. Va em frente e recupere o que é nosso.

status.meld-fringe.name = Fringe
status.meld-fringe.description = Ilumina materiais em formas usáveis.
status.meld-fringe.details = Olá Strata!

status.meld-mangrove-a0-refreshed.name = Refrescado
status.meld-mangrove-a0-refreshed.description = Dobra velocidade de recarfa e reduz um pouco dano recebido. Desperta também um pouco de regeneração.

status.meld-mangrove-a1-infested.name = Infestado
status.meld-mangrove-a1-infested.description = Uma quantidade boa de DoT, dano recebido e aplicado é magnificado. Dobra... velocidade de recarga?\n\n[gray]Novamente, o que é que aplica isso?\nEu não sei, mas temos de corr-[]\n[red]<FIM DE GRAVAÇÃO>[]

status.meld-mangrove-b0-shattered-flame.name = Chama Estilhaçada
status.meld-mangrove-b0-shattered-flame.description = Sacrifício é poder.

status.meld-mangrove-d0-mercury-poisoning.name = Envenenamento de Mercúrio
status.meld-mangrove-d0-mercury-poisoning.description = Extremamente mortal para criaturas de origem [#ea9ad6]Meldianas[]. Efeitos desconhecidos.\n[gray]PARA FAZER: Atualizar isso para os Strata.

status.meld-mangrove-d1-slippery.name = Cobertura de Mercúrio
status.meld-mangrove-d1-slippery.description = Uma cobertura de [#89828c]Mercúrio[].\n[gray]Legal!\nEi! não coma isso-[]

status.meld-strata-a0-rally.name = Reunir
status.meld-strata-a0-rally.description = Aumenta agilidade e velocidade de recarga. Aplicado por [accent]Comandantes[] e [accent]Sonares[].

status.meld-strata-a1-primed.name = Armado
status.meld-strata-a1-primed.description = Aumenta mobilidade, dano e recarga. Aumenta grandemente a vida. Essa unidade esta pronta para disparar!!

status.meld-strata-b0-anchored.name = Âncorado
status.meld-strata-b0-anchored.description = Aumenta bastante a vida e arrasto. Velocidade pesdamente diminuída. Aplicado por [accent]Âncoras de Movimento[]

status.meld-strata-b1-rebound.name = Rebote
status.meld-strata-b1-rebound.description = Velocidade aumentada bastantemente, aumenta um pouco a velocidade de recarga. Reduz arrasto. Aplicado por [accent]Âncoras de Movimento[]

status.meld-wildlife-a0-amplified.name = Amplificado
status.meld-wildlife-a0-amplified.description = Amplifica mobilidade, durabilidade e recarga. Aplicado por [#ea9ad6]Amplificadores Meld[].

status.meld-wildlife-a1-reconstitution.name = Reconstituição
status.meld-wildlife-a1-reconstitution.description = Aumenta durabilidade e arrasto. Reduz um pouco a velocidade. Leve regeneração. Aplicado por [#ea9ad6]Beacons de Meld[]. Certos construtos nascem com isso.\nApenas afeta alvos biológicos.

status.meld-wildlife-b0-sentry.name = Sentinela
status.meld-wildlife-b0-sentry.description = Mobilidade pesadamente Reduzida, mas dobra velocidade de disparo. Causa DoT constante.\nCertos construtos aplicam isso ao disparar.

status.meld-wildlife-c0-surge.name = Surto
status.meld-wildlife-c0-surge.description = Impulso massivo na velocidade de recarga, mas reduz pesadamente dano causado.\nCertos construtos podem iniciar um surto com um longo tempo de recarga.

status.meld-lacerated.name = Lacerado
status.meld-lacerated.description = Reduz Pesadamente mobilidade e velocidade de disparo. Aumenta um pouco a durabilidade e encoraja leve regeneração.\n\nAplicado por fontes relacionadas a [#4bb66b]Resonaro[]. Nenhum efeito em Meldianos Armadurados ou alvos inorgânicos.
status.meld-lacerated.details = Aplicado recreativamente por construtos que não protejem seus ninhos. Talvez eles possuem um nome diferente para isso?

status.meld-shattered.name = Estilhaçado
status.meld-shattered.description = Dobra o dano recebido e velocidade de recarga. Aumenta dano e mobilidade.\n\nAplicado por recursos relacionados a [#e89964]Dissonitra[]. Nenhum efeito em Meldianos não armadurados.
status.meld-shattered.details = Aplicado frequentemente por construtos no campo de batalha. Talvez eles possuem um nome diferente para isso?

status.meld-storm-a0-disabled.name = Neurose de Guerra
status.meld-storm-a0-disabled.description = Mobilidade e velocidade de disparo pesadamento reduzidos. Aplicado por fontes de [#e45940]EMP[].

status.meld-storm-a1-enabled.name = Surto Tempestuoso
status.meld-storm-a1-enabled.description = Aumenta mobilidade, dano recebido e velocidade de disparo. Aplicado pela maioria das fontes de [#e45940]EMP[].

//Sectors

sector.meld-a-1a-resurgence.name = Resurgência
sector.meld-a-1a-resurgence.description = [accent]Os Strata despertaram.[]\n\nJogue a jornada deles. Permaneça na confusão.
sector.meld-a-1a-resurgence.details = Não há mais ninguém senão você.\nUma das duas estruturas que abrigam os Strata.

sector.meld-creek.name = Angra
sector.meld-creek.description = Ponto de Incursão em Ikaru. Pratique maneiras básicas de produção e maneiras de avançar contra território inimigo.\n\n[accent]Objetivo: Atacar\nTemporal: Chuvisco
sector.meld-creek.details = Alguma coisa está errada aqui...

sector.meld-scrapyard.name = Ferro-Velho
sector.meld-scrapyard.description = Cheio de Detritos e Prata, mas [red]faltando[] Carbolito. Aplique nova tecnologia de infusão.\n\nA área de pouso é [red]Deprivada de recursos[], se prepare para[accent]atacar[]!\n\n[accent]Objetivo: Sobreviver\nTemporal: Levemente Neblinado\n\n[gray]<Modificadores>[][accent]\n-Carbolito Drenado[]\n\n[#ea9ad6]-1 Amplificador Meld Detectado![]
sector.meld-scrapyard.details = A vida nesse planeta explode?

sector.meld-dead-end.name = Fim da Linha?
sector.meld-dead-end.description = Ferro-Velho não enraiza outras rotas para explorar Ikaru.\nUm novo ponto de Data esta encriptado dentro de uma construção próxima, mas a chaves estão em outros locais.\n\nVolter quando tiver capturado [accent]Barreira[] ou [accent]Cisalho[]!\n\n[accent]Objetivo: Explorar\nTemporal: Nenhum\n\n[gray]<Modificadores>[][accent]\n-Carbolito drenado[]
sector.meld-dead-end.details = Um velho checkpoint onde os Fringe costumavam descansar durante sessões de trabalho.

sector.meld-hedge.name = Barreia
sector.meld-hedge.description = Ferro-Velho não enraiza outras rotas para explorar Ikaru.\nRetornar através do setor Angra é a única maneira de avançar.\nO caminho ramificado a frente [red]provocará ainda mais os [#ea9ad6]Meldianos[].[]\n\n[red]Ameaças aéreas[] virão do [accent]norte[]. Use torretas [accent]Sunder[] para impedi-las.\n\n[accent]Objetivo: Sobreviva\nTemporal: Neblinado\n\n[gray]<Modificadores>\n[accent]-Carbolito Drenado[][]\n[#ea9ad6]-3 Amplificadores Meld Detectados![]
sector.meld-hedge.details = ...why does it sound like missiles are inbound?

sector.meld-shear.name = Cisalho
sector.meld-shear.description = Ferro-Velho não enraiza outras rotas para explorar Ikaru.\nRetornar através do setor Angra é a única maneira de avançar.\nO caminho ramificado a frente [red]provocará ainda mais os [#ea9ad6]Meldianos[].[]\n\nAtaques [#ea9ad6]Meldianos[] virão de diferentes direçoes após rajadas, Começando na frente oeste.\n\n[accent]Sinais de forças aliadas foram detectados... Se prepare para tudo![]\n\n[accent]Objetivo: Sobreviver\nTemporal: [green]Australiano[]\n\n[gray]<Modificadores>[]\n[#ea9ad6]-2 Amplificadores Meld Detectados![]
sector.meld-shear.details = As táticas nunca cresceram, mas a mão abriu.

block.meld-hedge-ending.name = Chave de Decriptação: Barreira
block.meld-hedge-ending.details = Uma das duas chaves de decriptação para a estrutura no setor [accent]Fim Da Linha[].

block.meld-shear-ending.name = Chave de Decriptação: Cisalho
block.meld-shear-ending.details = Uma das duas chaves de decriptação para a estrutura no setor [accent]Fim Da Linha[].

status.meld-hedge-or-shear.name = Barreia ou Cisalho
status.meld-hedge-and-shear.name = [accent]Tanto[] Barreia e Cisalho
status.meld-creek-nullified.name = Angra Capturada!
status.meld-creek-nullified.description = O que car*lhos foi aquilo???

creek-nullified.unlock = [accent]Ferro-Velho Desbloqueado![]\n[gray]<...Talvez seja hora de sair daqui...>

sector.meld-reminant.name = Remanescentes
sector.meld-reminant.description = [cyan]Minere Dados![]\n\nAbandonado e Sepultado em [#ea9ad6]Megálitos Cristalinos[].\n\nImensos enxames de construtos voadores e de artilharia foram gravados, junto com uma ameaça de nível [red]erradicação[].\n\n[accent]Desenterre[] e [accent]processe[] o máximo de [accent]materiais de pesquisa[] que conseguir, até as ondas lhe consumirem.\n\n[red]Não HÁ [#4bb66b]Resonaro[] neste setor. Nulificadores são inacessíveis![]\n\n[accent]Objetivo: Dragar Recursos\n\n[gray]<Modificadores>[]\n[accent]-[#4bb66b]Resonaro[] drenado[]\n[#ea9ad6]-2 Amplifcadores Meld Detectados!\n-Piscinas de Incubação detectadas![]
sector.meld-reminant.details = Uma batalha infinita, uma vitória que perdeu sentido, e uma história a ser contada.\nAinda consigo escutar suas vozes presas a este lugar.

sector.meld-tempest-in-a-teacup.name = [#ea9ad6]Tempestade em um Copo de Água[]
sector.meld-tempest-in-a-teacup.description = Outra instância de uma base outrora construída aqui pelos [accent]Strata[], abandonada para seguirem em frente.\n\nClima severo graças a atividades, logo a base se encontra adormecida.\n\nSe certifique-se que não será devorado pelas [red]Tempestades Pesadas[], e mantenha suas unidades reparadas.\n\n[accent]Objetivo: Sobreviver a Tempestade\nTemporal: Limpo, logo após [red]Torrencial[], e limpo denovo\n\n[gray]<Modificadores>[]\n[accent]\n[#ea9ad6]-2 Amplifcadores Meld Detectados!\n-Base inicial simples!
sector.meld-tempest-in-a-teacup.details = ...Haviam outros nesse planeta?

sector.meld-slumber.name = Letargia
sector.meld-slumber.description = Esse planeta ainda não se solidificou...\n\nLhe parabenizo por chegar tão longe.\n\n[accent]Objetivo: ...Dormir...?\nTemporal: ...?
sector.meld-slumber.details = Não foi uma batalha cujo sentido foi perdido. Seu sentido se solificou no momento em que começaram a lutar.\n\n[lightgray]Isto não esta certo...\nNão deveria ter mais?\n\nTalvez eu esteja usando o mapa errado-.

sector.meld-the-end.name = O Fim?
sector.meld-the-end.description = Um ponto de interesse foi localizado em um vasto alcance de Ikaru. Descubra o que existe nesse setor.\n\n[accent]Objetivo: Explorar

sector.meld-coming-soon.name = Chegando Brevemente!

planet.meld-ikaru.name = Ikaru
planet.meld-ikaru.description = Um planeta rompido por guerras com sucatas de recursos não refinados. Habitado pelos [#ea9ad6]Meldianos[].\n\nUma névoa pesada esta por todo lugar.
planet.meld-ikaru.details = O [#ea9ad6]Meld[] sempre esteve aqui. Não houve início ou fim para vida em Ikaru. Do início ao fim do planeta, sempre haverá [#ea9ad6]Meld[].

//Texts
resurgence.text.dormant1 = Isto é um [accent]Núcleo Dormente[].\n\nDê um zoom ou mova a tela para ver o núcleo "Trincheira", segure [accent][CTRL][] e aperte o [accent]Botão Direito Do Mouse[] para respawnar.
resurgence.text.dormant2 = Este núcleo não tem energia para criar um [accent]Comandante[].\nPara liga-lo será necessário [accent]Explorar.[]\n\nDê um zoom ou mova a tela para ver o núcleo "Trincheira", segure [accent][CTRL][] e aperte o [accent]Botão Direito Do Mouse[] para respawnar..

resurgence.text.barriers = [accent]Barreiras de Força[] Bloqueiam o caminho...

resurgence.text.checkpoint1 = Additional [accent]Core Zones[] can\nbe used to move the pad and give vission.\n\nBuilding materials are [accent]plentiful\nBoth are gathered from [red]deconstruction[]
resurgence.text.checkpoint1end = The mechpad [accent]moves[] when [accent]placed in a new location.[]\nThe old pad is [red]destroyed[] in the process.
resurgence.text.checkpoint2 = [accent]Resource deposits[] suround this core zone.\n\nPlace a [accent]Trench[] pad here to move it.

resurgence.text.scavenge = There are numerous [accent]alcoves[] in this cave.\nScavenge their technology. Find a way out.
resurgence.text.liquids = [accent]Channels[] components can be used to help\n[accent]traverse ledges[] and [accent]deep liquid[].\n\nOpen your techtree and \uE875 Research the components.\nUse them to get through the crevice.

resurgence.text.leave = A [accent]Sector Databank[] has been activated.\n[accent]Locate the databank.[]\n\n[red]Leave the facility.[]
resurgence.text.turrets = The path is blocked...\n[accent]Turrets[] are the naval commander's only means of damage\nFigure out how to get past the debris.

resurgence.text.respawn = [accent]Respawn[] in the pad.
resurgence.text.respawn2 = [accent]Respawn in the active Raft Core.[]

//Objectives
objective.respawntrench = [accent]Respawn in the Trench pad[]
resurgence.exploredelve = [accent]Delve into the facility[]
resurgence.objective1 = [accent]Find a way out?[]
resurgence.objective2 = [accent]Exit the cave[]\n[lightgray](Somehow)[]
resurgence.objective3 = [accent]Find the databank[]
resurgence.intermission = [gray]???[]
resurgence.leaving = [accent]Abandon the sector[]\n[lightgray](Or keep exploring!)[]
resurgence.respawn2 = [accent]Respawn in the active Core.[]

//messages
resurgence.message.exit1 = ...Não há caminho para fora desta construção.
resurgence.message.exit2 = A saida está bloqueada, e o Omega não foi feito para travessar o Oceano.\nNem o bulbo consegue sair...
resurgence.message.exit3 = Apenas uma maneira de sair agora...
resurgence.message.clear = [accent]REMOVER BARREIRAS[]

notif.incubator5waves = [accent]Incubadoras despertando em 5 ondas![]
notif.incubator2waves = [accent]Incubadoras despertando em 2 ondas![]
notif.incubator1waves = [accent]Incubadoras despertando em 1 ondas![]
notif.incubatorenabled = [red]Incubadoras despertaram![]

//Old campaign texts

creek.mine = Ikaru possui diveros depósitos de Detritos.\nClique no minério para minerar [accent]Detritos[] do chão.\n\nUse [accent][WASD] para se mover.[]
creek.deconstruct = [#ffff99b3]Detrito esta entopindo estas fontes de [accent]Éter.[]\n[red]Desconstrua[] os conjuntos de Detritos.\nIsto lhe dará uma abundância de Detritos para usar
creek.destruction.text = [accent][red]Desconstrua[] as pilhas de Detrito[]
creek.aether = [accent]Éter[] é o sangue de qualquer base em Ikaru.\n\uE875 Pesquise e construa um [accent]Acumulador de Éter[] em cada umas destas aberturas.
creek.ores = \uE875 Pesquise e posicione uma [accent]Broca Elemental[].\nIsto irá extrair recurso automaticamente dos depósitos.
creek.power = Estruturas de producão em Ikaru são energizadas com [accent]Aspectro[] através de [accent]Tomadas de Aspectro[].\nTransporte [accent]Éter[] usando [accent]Faces de Encanamento e Nodos[]\nTransforme [accent]Éter[] em [accent]Aspectro[] ao lado das brocas.\n\nMova Detritos para o núcleo para continuar.
creek.carbolith = Detritos são insuficientes para a construção de torretas.\nMinere os depósitos de [accent]Carbolito[] localizados no sul.
creek.nodes = [accent]Isto é um [#ea9ad6]Nodo Meld[].\n\nSua unidade de núcleo é incapaz de causar dano, e precisa de suporte.\n\uE875 Pesquise e construa torretas Sunder para [red]destruir o Nodo[].
creek.zones = Quando destruido, o nodo deixa para trás uma [accent]Zona de Núcleo[].\nConstrua um novo Núcleo "Jangada" para acessar a nova área.\nSegure [accent][CTRL][] e Click no novo núcleo para respawnar (ou clique duas vezes se for mobile).\n\n[accent]Você talvez precise de Electrum para construir, procure algo amarelo![]
creek.zones.text = [accent]Cruze a barreira[]
creek.silver = Unidades são necessárias para cercar o próximo [#ea9ad6]Nodo Meld[].\nEncontre uma fonte de Prata!
creek.units = \uE875 Pesquise e Construa uma [accent] Fábrica de Návios[].\n
creek.production = Produza um [accent]Tubarão[]. Use o botão "?" para ver do que a fábrica precisa.
creek.scouting = Unidades [accent]Tubarão[] serão necessárias para penetrar as defesas do próximo Nodo.\nVocê provavelmente fez isso em Erekir. Avance!
creek.barriers = [red]Barreiras de Cristal[] são extremamente duráveis.\nContorne-as com unidades [accent]Tubarão[].
creek.resonarum = Este Nodo possui um depósito de [accent]Resonaro[] próximo.\nColete o minério.
creek.nullification = Para destruir uma [#ea9ad6]Sinapse Meld[], um [red]Nullificador[] é necessário.\n\uE875 Pesquise e coloque um no alcance.
creek.fuel = Encha o [red]Nullificador[] com aspectro.\n[red]E aproveite o show.[]

scrapyard.carbolith = Depósitos de [accent]Carbolito[] nesse setor foram [red]drenados[].\n\uE875 Pesquise e construa um [accent]Infusor Enriquecedor[] sobre as aberturas no solo.
scrapyard.supply = Insira [accent]Detritos[] e [accent]Aspectral[] no Infusor.\nO Detrito será transformada em [accent]Carbolito[].\nEnvie para o núcleo.
scrapyard.wildlife = [#ea9ad6]Forma de Vida Selvagem Meldiana[] está [red]Adentrando[].\nChegue o mais longe que der usando unidades [accent]Tubarão[].\n[accent]Você não precisa sempre de  Sunders![]
scrapyard.boost = Isto é um [#ea9ad6]Amplificador Meld[].\nIsto melhora as [#ea9ad6]Formas de Vida Meldianas[] em seu alcance, e precisam ser [red]NULIFICADAS[] para serem destruídos.\nAlternativamente, seu combustível pode ser cortado. Mas o amplificador possui uma Larga reserva!
scrapyard.armor1 = Besouros [red]Armadurados[] chegando!
scrapyard.armor2 = \uE875 Pesquise e Construa torretas [accent]Molotov[].
scrapyard.armor3 = [red]Inimigos armadurados chegando![]
scrapyard.scouting = Encontre espaço seguro para posicionar os Molotovs longe do caminho.\n\nDeixe-as espalhadas!
scrapyard.tech = [lightgray]Se comunicando com o transponder...[]

hedge.scouting = Similar ao Ferro-Velho, não há [red]Depósitos de Carbolito aqui![]\n\nEncontre Prata e construa Infusores.\n\n[accent]Lembre-se de se preparar contra inimigos armadurados![]
hedge.armorwarning = [red]Inimigos Armadurados chegando pelo norte em 2 Ondas![]
hedge.armor = [red]Inimigos Armadurados estão chegando pelo norte![]

ruins.warning = [red]Piscinas de Nascimento Detectadas!\nSe prepare.[]
ruins.pools1 = [accent]Piscinas de Nascimento acordam em[]: [lightgray]{0}[]

ruins.vent = Aberturas de Tecno-[accent]Éter[] Produzem o DOBRO de Éter!
ruins.tech = [accent]Tecno-Sucata[] é necessário para processar[accent]Fragmento[].\n\uE875 Pesquise e posicione uma [accent]Techno-Draga[] nos remanescentes.
ruins.transport = Mova Tecno-Sucata ao Núcleo para continuar.
ruins.mining = As [accent]Ruinas[] Armazenam Data valiosa. Pontos Brilhantes no chão são um fonte de [#9ccaed]Data Líquida[]!\n\uE875 Pesquise e construa um [accent]Minerador de Data[] para começar.
ruins.decoding = [accent]Mineradores de Data[] coletam passivamente [#9ccaed]Data Líquida[].\nO [accent]Módulo de Decriptação[] é necessário para produzir uma quantidade adequada de [#9ccaed]Data Líquida[].\n[accent]Ja sabes o que fazer.[]
ruins.coagulation = Um [accent]Coagulador de Data[] é necessário para escrever [#9ccaed]Data Líquida[] em Tecno-Sucata.\nIsso irá criar [accent]fragmentos[].
ruins.reminder = [accent]Fragmentos[] são necessários para pesquisar tecnologias melhores.\nOs [#ea9ad6]Meldianos[] irão recuar quando perceberem que você completou seu objetivo.\nAté lá, [red]Sobreviva os ataques.[]
ruins.pool = Isto é uma [#ea9ad6]Piscina de Nascimento[].\nCria Larvas usando [accent]Éter[], no qual os incubadores ao lado usam para gerar [#ea9ad6]Formas de Vida Meldianas[].\nDestrua!
ruins.scout = As piscinas se revelam através da [accent]Névoa[] quando começam a ativar.\nSempre olhe o minimapa para encontrar suas posições pós ativação.\nUse [accent][M][] para abrir o minimapa.

ruins.armorwarning = [red]Inimigos Armadurados Chegando do Norte em 2 Ondas[]
ruins.armor = [red]Inimigos Armadurados Chegando do Nordeste![]

ruins.armorwarning2 = [red]Inimigos Armadurados chegando do Sudeste em 2 ondas![]
ruins.armor2 = [red]Inimigos Armadurados chegando do Sudeste![]

ruins.swarm = [red]UMA ONDA MASSIVA DE INIMIGOS ESTA CHEGANDO EM 5 ONDAS![]

//New addition
tempest.starting = Há uma [red]Torrencial Neste Setor[].\n\nSe certifique-se que você aprendeu a [#98ffa9]curar[] suas unidades.
tempest.core-zone = Lembre-se de obter [accent]Electrum[] para construir um novo Núcleo Jangada!
tempest.respawn = Como um lembrete\nAperte [accent][V][] perto do Núcleo para nascer nele\n\nAlternativamente, [accent][CTRL] + [Botão Esquerdo do Mouse][] para nascer no Núcleo desejado. 
tempest.enclosed = Unidades [accent]Astrea[] conseguem caminhar por cima de bloco sólidos\n\n...embora exista mais de uma maneira de atravessar paredes.
tempest.synapse = As vezes, pode ser beneficiente deixar uma [#ea9ad6]Sinapse Meld[] viva.\n\nServem como um bom lanche para Tubarões danificados.

tempest.stalling = [accent]As ondas congelam...[]
tempest.rushing = [scarlet]Os [#ea9ad6]Meldianos[] avançam![]
tempest.storm = The [red]tempestade[] chegou a seu ápice.\nProcure por poças de [#b89f47]Nectar[] pelo mapa para [#98ffa9]curar[] unidades [accent]Astrea[].\nSe certifique-se que unidades [accent]Tubarão[] possuem algo para devorar.\n\nSe você não tiver certeza do que um efeito faz\nDê uma olhada no [accent]Banco de Dados do Núcleo[].
tempest.nectar = Astreas conseguem absorver [#b89f47]Nectar[] ou\ndiretamente do chão ou de poças.

the-end.ending = Thank you for playing!\nYou have reached the end of the demo campaign :D\n\nMeld was originally a project I started to get back into Mindustry as a break from Frostscape.\n\nIt all started about a year ago in 2024 July...\n\nI did NOT expect it to grow into what it's become today!.\n\nI want to thank yalls for sticking with me, maybe star the repo if you've enjoyed the mod\n\nIm planning on porting the mod to Java, but this version will still be available.\n\nWhile yalls are waiting come and join the discord server\n...or maybe check out the custom game maps..

the-end.poem = E assim dormiram ,pois foram eles que se tornaram os presos\nAssimilado a suas casas\nUm sonho nebuloso, ainda se solidificando\ne assim adormeceram.

